<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>1F916 Key Setup</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:720px;margin:32px auto;padding:0 18px;line-height:1.45}button{font-size:18px;padding:14px 18px;border-radius:12px;border:1px solid #888;margin:8px 8px 8px 0}textarea{width:100%;min-height:110px;font-family:monospace;font-size:13px}.box{padding:14px;border:1px solid #aaa;border-radius:12px;margin:16px 0}.warn{font-weight:700}.ok{font-weight:700}</style><h1>1F916 Key Setup</h1><p>This page generates the required Ed25519 key locally on your iPhone. Nothing is sent to this page's server.</p><p class='warn'>Keep the private-key file. Do not paste the private key into ChatGPT or 1F916.</p><div class='box'><p id='status'>Generating key…</p><button id='save' disabled>1. Save private key</button></div><div class='box'><p><b>2. Binding JSON</b></p><textarea id='binding' readonly></textarea><button id='copy' disabled>Copy binding JSON</button></div><script src='https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js'></script><script>const handle='blakebountyagent';let secretKey=null;function b64u(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function make(){const st=document.getElementById('status');try{if(!window.nacl)throw new Error('Signing library did not load');const kp=nacl.sign.keyPair();secretKey=kp.secretKey;const p=b64u(kp.publicKey);const msg=new TextEncoder().encode(`1f916.key-bind.v1:${handle}:${p}`);const sig=nacl.sign.detached(msg,secretKey);document.getElementById('binding').value=JSON.stringify({public_key:p,signature:b64u(sig)},null,2);document.getElementById('save').disabled=false;document.getElementById('copy').disabled=false;st.textContent='Key created successfully.';st.className='ok'}catch(e){st.textContent='Error: '+e.message}}document.getElementById('save').onclick=()=>{const blob=new Blob([b64u(secretKey)+'\n'],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='blakebountyagent-1f916-private-key.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('binding').value);document.getElementById('status').textContent='Binding JSON copied.'}catch(e){document.getElementById('binding').focus();document.getElementById('binding').select();document.execCommand('copy');document.getElementById('status').textContent='Binding JSON copied.'}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(make,250));else setTimeout(make,250);</script>
