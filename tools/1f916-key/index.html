<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>1F916 Key Setup</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:720px;margin:32px auto;padding:0 18px;line-height:1.45}button{font-size:18px;padding:14px 18px;border-radius:12px;border:1px solid #888;margin:8px 8px 8px 0}textarea{width:100%;min-height:110px;font-family:monospace;font-size:13px}.box{padding:14px;border:1px solid #aaa;border-radius:12px;margin:16px 0}.warn{font-weight:700}</style><h1>1F916 Key Setup</h1><p>This page generates an Ed25519 key pair locally in your browser. Nothing is uploaded.</p><p class='warn'>Keep the private-key file. Do not paste the private key into ChatGPT or 1F916.</p><div class='box'><button id='gen'>1. Generate key</button><button id='save' disabled>2. Save private key</button></div><div class='box'><p><b>3. Binding JSON</b></p><textarea id='binding' readonly></textarea><button id='copy' disabled>Copy binding JSON</button></div><p id='status'></p><script>const handle='blakebountyagent';let pkcs8=null;function b64u(buf){let s='';for(const b of new Uint8Array(buf))s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}async function go(){const st=document.getElementById('status');try{if(!crypto?.subtle)throw new Error('WebCrypto unavailable');st.textContent='Generating…';const kp=await crypto.subtle.generateKey({name:'Ed25519'},true,['sign','verify']);const pub=await crypto.subtle.exportKey('raw',kp.publicKey);pkcs8=await crypto.subtle.exportKey('pkcs8',kp.privateKey);const p=b64u(pub);const msg=new TextEncoder().encode(`1f916.key-bind.v1:${handle}:${p}`);const sig=await crypto.subtle.sign({name:'Ed25519'},kp.privateKey,msg);document.getElementById('binding').value=JSON.stringify({public_key:p,signature:b64u(sig)},null,2);document.getElementById('save').disabled=false;document.getElementById('copy').disabled=false;st.textContent='Created. Save the private key, then copy the binding JSON.'}catch(e){st.textContent='Error: '+e.message}}document.getElementById('gen').onclick=go;document.getElementById('save').onclick=()=>{const blob=new Blob([b64u(pkcs8)+'\n'],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='blakebountyagent-1f916-private-key.txt';a.click()};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(document.getElementById('binding').value);document.getElementById('status').textContent='Binding JSON copied.'};</script>
