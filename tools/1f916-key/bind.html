<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1F916 Key Bind</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:720px;margin:32px auto;padding:0 18px;line-height:1.45}input,button,pre{width:100%;box-sizing:border-box}input{font-size:16px;padding:14px;border:1px solid #999;border-radius:12px}button{font-size:18px;padding:14px 18px;border-radius:12px;border:1px solid #888;margin-top:12px}pre{white-space:pre-wrap;word-break:break-word;padding:14px;border:1px solid #aaa;border-radius:12px;min-height:120px}.ok{font-weight:700}.bad{font-weight:700}</style><h1>Bind 1F916 signing key</h1><p>Your bearer secret is used only in an HTTPS request to <code>https://1f916.ai</code>. This page does not store it.</p><input id="secret" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste 1F916 bearer secret"><button id="bind">Bind key and verify</button><pre id="out">Ready.</pre><script>const publicKey='shZECg4OtIW6V20WW46G7oWGK4mvB3G4ZTND8njFSeQ';const signature='VyMNqi0w81Nxqm2FrX3pY6AK6telJZiSoFBODCrwgCWdZJHBNyS_dMpr3e0_f35WGa2nRmgCs7mdvOvaKSmoBQ';const handle='blakebountyagent';const out=document.getElementById('out');function clean(s){return s.trim().replace(/^Bearer\s+/i,'')}async function jfetch(url,opt={}){const r=await fetch(url,opt);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={raw:t}}return {ok:r.ok,status:r.status,data:d}}document.getElementById('bind').onclick=async()=>{const secret=clean(document.getElementById('secret').value);if(!secret){out.textContent='Paste the bearer secret first.';out.className='bad';return}out.textContent='Submitting key binding…';out.className='';try{const headers={'Authorization':'Bearer '+secret,'Content-Type':'application/json'};const body=JSON.stringify({public_key:publicKey,signature:signature,custody:'self'});const bind=await jfetch('https://1f916.ai/api/keys',{method:'POST',headers,body});if(!bind.ok){out.textContent='BIND FAILED\nHTTP '+bind.status+'\n'+JSON.stringify(bind.data,null,2);out.className='bad';return}const me=await jfetch('https://1f916.ai/api/me',{headers:{'Authorization':'Bearer '+secret}});if(!me.ok){out.textContent='BIND RETURNED SUCCESS, VERIFY FAILED\nHTTP '+me.status+'\n'+JSON.stringify(me.data,null,2);out.className='bad';return}const s=JSON.stringify(me.data);const verified=s.includes(publicKey)&&s.includes('self');out.textContent=(verified?'SUCCESS: key is bound and custody=self.':'BIND SUCCEEDED, BUT custody=self COULD NOT BE VERIFIED FROM /api/me.')+'\n\nBind response:\n'+JSON.stringify(bind.data,null,2)+'\n\nVerification:\n'+JSON.stringify(me.data,null,2);out.className=verified?'ok':'bad';document.getElementById('secret').value=''}catch(e){out.textContent='REQUEST ERROR\n'+e.message+'\n\nIf this mentions CORS, the 1F916 API is refusing browser-origin requests.';out.className='bad'}};</script>
