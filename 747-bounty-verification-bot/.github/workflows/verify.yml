name: rustchain-bounty-verifier

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      user:
        description: GitHub claimant username
        required: true
      claim_text:
        description: Claim text to verify
        required: true

permissions:
  contents: read
  issues: write

jobs:
  verify-comment:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTCHAIN_NODE_URL: ${{ vars.RUSTCHAIN_NODE_URL }}
        run: python issue_comment_handler.py

  manual-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTCHAIN_NODE_URL: ${{ vars.RUSTCHAIN_NODE_URL }}
        run: python verifier.py --user '${{ inputs.user }}' --claim-text '${{ inputs.claim_text }}'
