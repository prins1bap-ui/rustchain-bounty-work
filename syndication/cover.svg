  <text x="88" y="188" fill="#f9fafb" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">bounty-spec drift</text>
  <text x="88" y="252" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="25">Catch stale commands, reward mismatches, and</text>
  <text x="88" y="286" fill="#d1d5db" font-family="Arial, Helvetica, sans-serif" font-size="25">acceptance-rule drift before contributors waste time.</text>
