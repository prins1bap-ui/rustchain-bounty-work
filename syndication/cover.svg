<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Detecting RustChain bounty-spec drift</title>
  <desc id="desc">Cover image for a tutorial about detecting stale commands, reward mismatches, and acceptance-rule drift in RustChain bounties.</desc>
  <rect width="1000" height="420" fill="#111827"/>
  <rect x="48" y="48" width="904" height="324" rx="24" fill="#1f2937" stroke="#6b7280" stroke-width="2"/>
