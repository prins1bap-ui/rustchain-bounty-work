name: bounty-747-tests
on:
  push:
    paths: ['bounty-747/**']
  pull_request:
    paths: ['bounty-747/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bounty-747
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
