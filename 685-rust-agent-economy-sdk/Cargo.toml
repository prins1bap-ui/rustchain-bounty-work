[package]
name = "rustchain-agent-economy"
version = "0.1.0"
edition = "2021"
description = "Rust client for the RustChain RIP-302 Agent Economy API"
license = "MIT"
repository = "https://github.com/prins1bap-ui/rustchain-bounty-work"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
