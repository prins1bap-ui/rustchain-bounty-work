name: Bounty 16517 SNES bsnes QA

on:
  push:
    branches:
      - bounty-16517-snes-bsnes-20260911
  workflow_dispatch:

jobs:
  bsnes-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout operator repo
        uses: actions/checkout@v4

      - name: Install bsnes source-build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 xvfb libgtk2.0-dev libpulse-dev mesa-common-dev libcairo2-dev libsdl2-dev libxv-dev libao-dev libopenal-dev libudev-dev zip

      - name: Build independent bsnes emulator
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/libretro/bsnes.git upstream/bsnes
          cd upstream/bsnes
          BSNES_SHA=$(git rev-parse HEAD)
          echo "BSNES_SHA=$BSNES_SHA" >> "$GITHUB_ENV"
          make -C bsnes local=false -j2
          test -x bsnes/out/bsnes
          cp bsnes/out/bsnes ../../bsnes-bin
          printf 'BSNES_SHA=%s\n' "$BSNES_SHA" | tee ../../snes-bsnes-preflight.txt
          sha256sum bsnes/out/bsnes | tee -a ../../snes-bsnes-preflight.txt

      - name: Pin upstream SNES source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Scottcjn/elya-snes.git upstream/elya-snes
          cd upstream/elya-snes
          git checkout 0ed1aae3e9cc900da3bc6f88a9abf1bf612f669b
          test "$(git rev-parse HEAD)" = "0ed1aae3e9cc900da3bc6f88a9abf1bf612f669b"
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" | tee -a ../../snes-bsnes-preflight.txt

      - name: Verify pinned benchmark ROM
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream/elya-snes
          test -f out/nn.sfc
          sha256sum out/nn.sfc | tee -a ../../snes-bsnes-preflight.txt
          cp out/nn.sfc ../../nn.sfc

      - name: Emulator identity and headless smoke test
        shell: bash
        run: |
          set -euxo pipefail
          ./bsnes-bin --help > bsnes-help.txt 2>&1 || true
          head -100 bsnes-help.txt | tee -a snes-bsnes-preflight.txt
          timeout 8s xvfb-run -a ./bsnes-bin "$PWD/nn.sfc" > emulator-smoke.log 2>&1 || rc=$?
          rc=${rc:-0}
          echo "smoke_exit=$rc" | tee -a snes-bsnes-preflight.txt
          tail -100 emulator-smoke.log | tee -a snes-bsnes-preflight.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty-16517-snes-bsnes-preflight
          path: |
            snes-bsnes-preflight.txt
            emulator-smoke.log
            bsnes-help.txt
            nn.sfc
            bsnes-bin
          if-no-files-found: ignore
