name: Bounty 16517 SNES bsnes

on:
  push:
    branches: [bounty-16517-snes-bsnes-20260910]
    paths:
      - '.github/workflows/bounty-16517-snes-bsnes.yml'
      - '16517-snes-bsnes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime and ROM-build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cc65 xvfb xdotool python3 python3-numpy git curl unzip ca-certificates libsdl2-2.0-0 libgtk-3-0 libao4 libopenal1 libxv1
          ca65 --version >cc65-version.txt 2>&1 || true
          python3 - <<'PY'
          import numpy as np
          print(np.__version__)
          PY
      - name: Fetch pinned official bsnes nightly binary
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o bsnes-ubuntu.zip \
            https://github.com/bsnes-emu/bsnes/releases/download/nightly/bsnes-ubuntu.zip
          echo 'ccc3a2bb2c94c90bb443b1677f9f54db248d779e5e72e24a54d81ac3200c6c52  bsnes-ubuntu.zip' | sha256sum -c -
          unzip -l bsnes-ubuntu.zip | tee bsnes-archive.txt
          mkdir bsnes-dist
          unzip -q bsnes-ubuntu.zip -d bsnes-dist
          BSNES_PATH="$(find bsnes-dist -type f -name bsnes -perm -u+x | head -n1)"
          test -n "$BSNES_PATH"
          cp "$BSNES_PATH" bsnes-bin
          chmod +x bsnes-bin
          sha256sum bsnes-bin | tee bsnes-sha256.txt
          cat > bsnes-version.txt <<'EOF'
          bsnes official nightly 2026-05-23
          tag: nightly
          commit: 7d5aa1e656b9171524d01b1b22917197d8121cb4
          release asset: bsnes-ubuntu.zip
          release asset sha256: ccc3a2bb2c94c90bb443b1677f9f54db248d779e5e72e24a54d81ac3200c6c52
          EOF
          ldd ./bsnes-bin | tee bsnes-ldd.txt
          if grep -q 'not found' bsnes-ldd.txt; then exit 1; fi
          set +e
          timeout --signal=INT --kill-after=2s 5s xvfb-run -a ./bsnes-bin --help >bsnes-help.txt 2>&1
          help_rc=$?
          set -e
          echo "bsnes_help_probe_rc=$help_rc" >> bsnes-help.txt
      - name: Clone exact SNES source
        run: |
          set -euxo pipefail
          git clone https://github.com/Scottcjn/elya-snes.git upstream
          cd upstream
          git checkout 1464529b9bd92c75e2c21cebd65af104b8976e82
          test "$(git rev-parse HEAD)" = '1464529b9bd92c75e2c21cebd65af104b8976e82'
      - name: Build canonical profile ROMs
        run: |
          set -euxo pipefail
          cd upstream
          SNES_FAST=0 NAME=nnprof DEFS='-DPROFILE' ./build_nn.sh
          SNES_FAST=1 NAME=nnfastprof DEFS='-DFASTROM=1 -DPROFILE' ./build_nn.sh
          sha256sum out/nnprof.sfc out/nnfastprof.sfc | tee ../rom-sha256.txt
      - name: Run repeated SlowROM and FastROM profiles under bsnes
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -euxo pipefail
          mkdir -p evidence

          run_profile() {
            variant="$1"
            rom="$2"
            fastflag="$3"
            idx="$4"
            work="$PWD/evidence/${variant}-${idx}"
            mkdir -p "$work/home"
            cp "$rom" "$work/${variant}.sfc"
            log="$work/bsnes.log"
            save="$work/${variant}.srm"

            set +e
            HOME="$work/home" timeout --signal=INT --kill-after=5s 90s xvfb-run -a ./bsnes-bin "$work/${variant}.sfc" >"$log" 2>&1 &
            runner=$!
            set -e

            done_seen=0
            for sec in $(seq 1 85); do
              if [ -f "$save" ]; then
                if python3 - "$save" <<'PY'
          import sys
          p=sys.argv[1]
          try:
              d=open(p,'rb').read()
          except OSError:
              raise SystemExit(1)
          raise SystemExit(0 if len(d) >= 12 and d[0:4] == b'ELYA' and d[8:12] == b'DONE' else 1)
          PY
                then
                  done_seen=1
                  echo "DONE ${variant} run ${idx} after ${sec}s" | tee "$work/status.txt"
                  break
                fi
              fi
              sleep 1
            done

            kill -INT "$runner" 2>/dev/null || true
            wait "$runner" 2>/dev/null || true
            test "$done_seen" -eq 1
            test -f "$save"
            cp "$save" "$PWD/evidence/${variant}-${idx}.srm"
            sha256sum "$PWD/evidence/${variant}-${idx}.srm" | tee "$PWD/evidence/${variant}-${idx}.sha256"
            python3 upstream/tools/check_nn.py "$PWD/evidence/${variant}-${idx}.srm" | tee "$PWD/evidence/${variant}-${idx}-check.txt"
            if [ "$fastflag" = 1 ]; then
              python3 upstream/tools/prof_nn.py "$PWD/evidence/${variant}-${idx}.srm" --fast | tee "$PWD/evidence/${variant}-${idx}-profile.txt"
            else
              python3 upstream/tools/prof_nn.py "$PWD/evidence/${variant}-${idx}.srm" | tee "$PWD/evidence/${variant}-${idx}-profile.txt"
            fi
          }

          for i in 1 2 3; do
            run_profile slow upstream/out/nnprof.sfc 0 "$i"
          done
          for i in 1 2 3; do
            run_profile fast upstream/out/nnfastprof.sfc 1 "$i"
          done

          python3 - <<'PY' | tee evidence/summary.txt
          import hashlib, pathlib, re, statistics
          root=pathlib.Path('evidence')
          for variant in ('slow','fast'):
              vals=[]
              hashes=[]
              for i in (1,2,3):
                  b=(root/f'{variant}-{i}.srm').read_bytes()
                  hashes.append(hashlib.sha256(b).hexdigest())
                  text=(root/f'{variant}-{i}-profile.txt').read_text()
                  m=re.search(r'tokens/s\s+([0-9.]+)', text)
                  if not m:
                      raise SystemExit(f'missing tokens/s for {variant}-{i}')
                  vals.append(float(m.group(1)))
              print(f'{variant}: tokens/s={vals}; mean={statistics.mean(vals):.6f}; deterministic_sram={len(set(hashes)) == 1}')
              if len(set(hashes)) != 1:
                  raise SystemExit(f'{variant} SRAM differs across repeated runs')
          PY
      - name: Upload complete measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty-16517-snes-bsnes-measurement
          path: |
            bsnes-archive.txt
            bsnes-help.txt
            bsnes-version.txt
            bsnes-sha256.txt
            bsnes-ldd.txt
            cc65-version.txt
            rom-sha256.txt
            evidence/**
          if-no-files-found: error
