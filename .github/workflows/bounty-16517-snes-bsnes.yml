name: Bounty 16517 SNES bsnes

on:
  push:
    branches: [bounty-16517-snes-bsnes-20260910]
    paths:
      - '.github/workflows/bounty-16517-snes-bsnes.yml'
      - '16517-snes-bsnes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime and ROM-build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cc65 xvfb xdotool python3 python3-numpy git curl unzip ca-certificates libsdl2-2.0-0 libgtk-3-0 libao4 libopenal1 libxv1
          ca65 --version >cc65-version.txt 2>&1 || true
          python3 - <<'PY'
          import numpy as np
          print(np.__version__)
          PY
      - name: Fetch pinned official bsnes nightly binary
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o bsnes-ubuntu.zip \
            https://github.com/bsnes-emu/bsnes/releases/download/nightly/bsnes-ubuntu.zip
          echo 'ccc3a2bb2c94c90bb443b1677f9f54db248d779e5e72e24a54d81ac3200c6c52  bsnes-ubuntu.zip' | sha256sum -c -
          unzip -l bsnes-ubuntu.zip | tee bsnes-archive.txt
          mkdir bsnes-dist
          unzip -q bsnes-ubuntu.zip -d bsnes-dist
          BSNES_PATH="$(find bsnes-dist -type f -name bsnes -perm -u+x | head -n1)"
          test -n "$BSNES_PATH"
          cp "$BSNES_PATH" bsnes-bin
          chmod +x bsnes-bin
          sha256sum bsnes-bin | tee bsnes-sha256.txt
          cat > bsnes-version.txt <<'EOF'
          bsnes official nightly 2026-05-23
          tag: nightly
          commit: 7d5aa1e656b9171524d01b1b22917197d8121cb4
          release asset: bsnes-ubuntu.zip
          release asset sha256: ccc3a2bb2c94c90bb443b1677f9f54db248d779e5e72e24a54d81ac3200c6c52
          EOF
          ldd ./bsnes-bin | tee bsnes-ldd.txt
          if grep -q 'not found' bsnes-ldd.txt; then exit 1; fi
          set +e
          timeout --signal=INT --kill-after=2s 5s xvfb-run -a ./bsnes-bin --help >bsnes-help.txt 2>&1
          help_rc=$?
          set -e
          echo "bsnes_help_probe_rc=$help_rc" >> bsnes-help.txt
      - name: Clone exact SNES source
        run: |
          set -euxo pipefail
          git clone https://github.com/Scottcjn/elya-snes.git upstream
          cd upstream
          git checkout 1464529b9bd92c75e2c21cebd65af104b8976e82
          test "$(git rev-parse HEAD)" = '1464529b9bd92c75e2c21cebd65af104b8976e82'
      - name: Build canonical profile ROMs
        run: |
          set -euxo pipefail
          cd upstream
          SNES_FAST=0 NAME=nnprof DEFS='-DPROFILE' ./build_nn.sh
          SNES_FAST=1 NAME=nnfastprof DEFS='-DFASTROM=1 -DPROFILE' ./build_nn.sh
          sha256sum out/nnprof.sfc out/nnfastprof.sfc | tee ../rom-sha256.txt
      - name: Probe bsnes save-RAM behavior
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -euxo pipefail
          mkdir -p probe home
          cp upstream/out/nnprof.sfc probe/nnprof.sfc
          export HOME="$PWD/home"
          set +e
          timeout --signal=INT --kill-after=5s 60s xvfb-run -a ./bsnes-bin probe/nnprof.sfc >bsnes-run.log 2>&1
          rc=$?
          set -e
          echo "bsnes_rc=$rc" | tee probe-status.txt
          echo '--- possible save files ---' | tee -a probe-status.txt
          find "$HOME" "$PWD/probe" -type f \( -name '*.srm' -o -name '*.ram' -o -name '*.sav' -o -name '*.bs' \) -printf '%p %s bytes %TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null | tee -a probe-status.txt || true
          echo '--- bsnes log ---' | tee -a probe-status.txt
          tail -n 120 bsnes-run.log | tee -a probe-status.txt || true
          if [ "$rc" -eq 127 ]; then exit 1; fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty-16517-snes-bsnes-diagnostic
          path: |
            bsnes-archive.txt
            bsnes-help.txt
            bsnes-version.txt
            bsnes-sha256.txt
            bsnes-ldd.txt
            cc65-version.txt
            rom-sha256.txt
            probe-status.txt
            bsnes-run.log
          if-no-files-found: warn
