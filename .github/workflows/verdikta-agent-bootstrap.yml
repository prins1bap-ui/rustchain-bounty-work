name: Verdikta Agent Bootstrap

on:
  push:
    paths:
      - '.github/workflows/verdikta-agent-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Verdikta public agent docs and live feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verdikta-agent/docs
          python - <<'PY'
          import urllib.request
          from pathlib import Path

          targets = {
              "https://bounties.verdikta.org/agents.txt": "verdikta-agent/docs/agents.txt",
              "https://bounties.verdikta.org/api/docs": "verdikta-agent/docs/api-docs.json",
              "https://bounties.verdikta.org/feed.xml": "verdikta-agent/docs/feed.xml",
          }
          for url, path in targets.items():
              req = urllib.request.Request(url, headers={"User-Agent": "BAP2686VerdiktaAgent/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
              Path(path).write_bytes(data)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verdikta-agent/docs
          git commit -m "Capture Verdikta agent API documentation"
          git push
