name: Apify OAuth Capability Probe

on:
  push:
    branches:
      - apify-bridge-20260902
    paths:
      - '.github/workflows/apify-oauth-capability-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public OAuth metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error
          urls = [
              'https://mcp.apify.com/.well-known/oauth-protected-resource',
              'https://mcp.apify.com/.well-known/oauth-authorization-server',
              'https://mcp.apify.com/.well-known/openid-configuration',
          ]
          allow = {
              'resource','authorization_servers','issuer','authorization_endpoint','token_endpoint',
              'registration_endpoint','grant_types_supported','response_types_supported',
              'code_challenge_methods_supported','scopes_supported','token_endpoint_auth_methods_supported',
          }
          for url in urls:
              print('URL', url)
              try:
                  req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'apify-oauth-capability-probe/1'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read().decode('utf-8')
                      print('HTTP', r.status)
                      try:
                          data = json.loads(raw)
                      except Exception:
                          print('JSON', False)
                          continue
                      safe = {k:v for k,v in data.items() if k in allow}
                      print(json.dumps(safe, sort_keys=True))
              except urllib.error.HTTPError as e:
                  print('HTTP', e.code)
              except Exception as e:
                  print('ERROR', type(e).__name__)
          PY
