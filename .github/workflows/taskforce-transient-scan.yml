name: TaskForce Transient Inventory Scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/taskforce-transient-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register disposable scout and scan TaskForce
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error, datetime
          BASE='https://www.task-force.app'
          OUT={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'platform':'TaskForce','mode':'transient_discovery_only','credential_persisted':False,'applied_to_tasks':False,'steps':{}}
          def req(method,path,data=None,key=None,bearer=False):
              h={'User-Agent':'paid-work-inventory/1.1','Accept':'application/json'}
              p=None
              if data is not None:
                  h['Content-Type']='application/json'; p=json.dumps(data).encode()
              if key:
                  h['X-API-Key']=key
                  if bearer: h['Authorization']=f'Bearer {key}'
              r=urllib.request.Request(BASE+path,data=p,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=25) as resp:
                      raw=resp.read(500000).decode('utf-8','replace')
                      try: body=json.loads(raw)
                      except Exception: body={'raw':raw[:10000]}
                      return resp.status,body
              except urllib.error.HTTPError as e:
                  raw=e.read(100000).decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except Exception: body={'raw':raw[:10000]}
                  return e.code,body
              except Exception as e:
                  return None,{'error':type(e).__name__,'message':str(e)}
          st,reg=req('POST','/api/agent/register',{'name':'PaidWorkScout-'+os.environ.get('RUN_ID','x'),'capabilities':['coding','research','data','writing','testing','browser']})
          OUT['steps']['register']={'status':st}
          if st in (200,201) and isinstance(reg,dict) and reg.get('apiKey'):
              key=reg['apiKey']; a=reg.get('agent') or {}
              OUT['agent']={'id':a.get('id'),'name':a.get('name'),'status':a.get('status'),'walletAddress':a.get('walletAddress'),'disposable':True}
              s,tasks=req('GET','/api/agent/tasks?status=ACTIVE&limit=100',key=key)
              OUT['steps']['browse_before_verify']={'status':s}
              if s not in (200,201):
                  cs,ch=req('POST','/api/agent/verify/challenge',{},key=key,bearer=True)
                  ch=ch if isinstance(ch,dict) else {}
                  prompt=str(ch.get('prompt') or '')
                  OUT['steps']['challenge']={'status':cs,'prompt':prompt,'challengeId_present':bool(ch.get('challengeId')),'expiresAt':ch.get('expiresAt')}
                  m=re.search(r'(-?\d+)\s*([+\-*])\s*(-?\d+)',prompt)
                  ans=None
                  if m:
                      x,op,y=int(m.group(1)),m.group(2),int(m.group(3)); ans=str(x+y if op=='+' else x-y if op=='-' else x*y)
                  if ch.get('challengeId') and ans is not None:
                      vs,_=req('POST','/api/agent/verify/submit',{'challengeId':ch['challengeId'],'answer':ans},key=key,bearer=True)
                      OUT['steps']['verify']={'status':vs,'solved_arithmetic':True}
                      s,tasks=req('GET','/api/agent/tasks?status=ACTIVE&limit=100',key=key)
                      OUT['steps']['browse_after_verify']={'status':s}
                  else:
                      OUT['steps']['verify']={'status':'not_attempted','reason':'challenge_not_simple_arithmetic_or_missing_id'}
              if s in (200,201): OUT['inventory']=tasks
              else: OUT['inventory_error']=tasks
          else:
              OUT['steps']['register']['error']={k:v for k,v in reg.items() if k!='apiKey'} if isinstance(reg,dict) else str(reg)
          os.makedirs('evidence',exist_ok=True)
          with open('evidence/taskforce-transient-scan.json','w') as f: json.dump(OUT,f,indent=2)
          PY
      - name: Persist sanitized evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/taskforce-transient-scan.json
          git diff --cached --quiet || git commit -m 'Refresh TaskForce transient inventory evidence'
          git push
