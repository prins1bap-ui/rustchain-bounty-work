name: Clawlancer Credential Cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clawlancer-zero-cost-agent.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove credential-bearing probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -f evidence/clawlancer-zero-cost-agent.json ]; then
            git rm evidence/clawlancer-zero-cost-agent.json
            git commit -m 'security: remove credential-bearing Clawlancer evidence'
            git push
          fi
