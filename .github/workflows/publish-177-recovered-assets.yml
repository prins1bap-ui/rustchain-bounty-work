name: publish-177-recovered-assets

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  publish:
    if: github.event.issue.number == 19 && startsWith(github.event.comment.body, 'publish-177-assets')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact emailed PNGs
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          body = os.environ['COMMENT_BODY']
          vals = {}
          for line in body.splitlines()[1:]:
              if '=' in line:
                  k, v = line.split('=', 1)
                  vals[k.strip()] = v.strip()
          expected = {
              'url1': ('177-memes/rustchain_meme_seniority.png', 56474, '6c546c05eb7dab589aaa29c1d96e54ba14ddd678fe45fd603826136de6f527d4'),
              'url2': ('177-memes/bottube_meme_captcha_tables.png', 53579, 'f6599a967754ecb4b9933ae891ab3bafb39dc4dc7b922775e1abe7d0a8f35ece'),
          }
          for key, (dest, size, sha) in expected.items():
              url = vals[key]
              with urllib.request.urlopen(url, timeout=30) as r:
                  data = r.read()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'{key}: not PNG'
              assert len(data) == size, f'{key}: size mismatch {len(data)} != {size}'
              actual = hashlib.sha256(data).hexdigest()
              assert actual == sha, f'{key}: sha mismatch {actual} != {sha}'
              p = pathlib.Path(dest)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print(dest, len(data), actual)
          PY
      - name: Commit exact recovered assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 177-memes/*.png
          git diff --cached --quiet && exit 0
          git commit -m 'publish: recover exact #177 meme submissions'
          git push
