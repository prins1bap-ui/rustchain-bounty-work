name: verify-177-published-assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovered #177 PNGs
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < 177-memes/rustchain_meme_seniority.png)" -eq 56474
          test "$(sha256sum 177-memes/rustchain_meme_seniority.png | awk '{print $1}')" = "6c546c05eb7dab589aaa29c1d96e54ba14ddd678fe45fd603826136de6f527d4"
          test "$(wc -c < 177-memes/bottube_meme_captcha_tables.png)" -eq 53579
          test "$(sha256sum 177-memes/bottube_meme_captcha_tables.png | awk '{print $1}')" = "f6599a967754ecb4b9933ae891ab3bafb39dc4dc7b922775e1abe7d0a8f35ece"
          echo '#177 recovered assets verified.'
