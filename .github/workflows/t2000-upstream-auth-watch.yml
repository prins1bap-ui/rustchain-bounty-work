name: t2000 Upstream Auth Watch

on:
  push:
    paths:
      - '.github/workflows/t2000-upstream-auth-watch.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream auth issue for maintainer response
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://api.github.com/repos/mission69b/t2000/issues/256/comments?per_page=100'
          req=urllib.request.Request(url, headers={'User-Agent':'t2000-auth-watch/1.0','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as r:
              comments=json.load(r)
          external=[c for c in comments if c.get('user',{}).get('login') != 'prins1bap-ui']
          print(json.dumps({'comment_count':len(comments),'external_reply_count':len(external)}, indent=2))
          if external:
              latest=external[-1]
              body=(latest.get('body') or '').strip()
              with open('/tmp/reply.txt','w') as f:
                  f.write(f"Upstream t2000 auth issue #256 has a response from @{latest.get('user',{}).get('login','unknown')}.\n\n{body[:4000]}\n\n{latest.get('html_url','')}")
          PY
          if [ -s /tmp/reply.txt ]; then
            echo 'reply=true' >> "$GITHUB_OUTPUT"
            {
              echo 'body<<EOF'
              cat /tmp/reply.txt
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'reply=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Raise local execution alert
        if: steps.check.outputs.reply == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 't2000 headless auth response received';
            const body = `${{ steps.check.outputs.body }}`;
            const { data: issues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }
