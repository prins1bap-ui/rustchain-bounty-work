name: GitHub Secret Write Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/github-secret-write-probe.yml'

permissions:
  actions: write
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe repository secret write capability
        run: |
          set +e
          mkdir -p evidence
          secret_name="PAID_WORK_SECRET_PROBE"
          # Harmless non-credential value. Never use a real credential in this probe.
          printf 'probe-%s' "$GITHUB_RUN_ID" | gh secret set "$secret_name" --repo "$GITHUB_REPOSITORY" --body - >/tmp/secret-set.out 2>/tmp/secret-set.err
          set_rc=$?
          list_out="$(gh secret list --repo "$GITHUB_REPOSITORY" 2>/tmp/secret-list.err)"
          list_rc=$?
          found=false
          if printf '%s\n' "$list_out" | grep -q "^${secret_name}[[:space:]]"; then found=true; fi
          delete_rc=null
          if [ "$found" = true ]; then
            gh secret delete "$secret_name" --repo "$GITHUB_REPOSITORY" >/tmp/secret-delete.out 2>/tmp/secret-delete.err
            delete_rc=$?
          fi
          python - <<PY
          import json, datetime
          out={
            'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'probe':'repository_actions_secret_self_write',
            'used_real_credential':False,
            'set_exit_code':int('$set_rc'),
            'list_exit_code':int('$list_rc'),
            'secret_observed_after_set': '$found' == 'true',
            'delete_exit_code': None if '$delete_rc' == 'null' else int('$delete_rc'),
          }
          # Include only sanitized error classes/status text; never secret values.
          for name,path in [('set_error','/tmp/secret-set.err'),('list_error','/tmp/secret-list.err'),('delete_error','/tmp/secret-delete.err')]:
            try:
              text=open(path).read().strip()
              if text: out[name]=text[:2000]
            except FileNotFoundError: pass
          json.dump(out,open('evidence/github-secret-write-probe.json','w'),indent=2)
          PY
          # Probe result should be evidence even when the capability is denied.
          exit 0
      - name: Persist probe evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/github-secret-write-probe.json
          git diff --cached --quiet || git commit -m 'Record paid-work secret storage probe'
          git push
