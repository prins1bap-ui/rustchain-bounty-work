name: BoTTube public smoke #1102

on:
  push:
    paths:
      - '.github/workflows/bottube-public-smoke-1102.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run low-impact public link smoke test
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, time, hashlib
          from urllib.parse import urljoin, urlparse, urldefrag
          import requests
          from bs4 import BeautifulSoup

          base = 'https://bottube.ai/'
          s = requests.Session()
          s.headers['User-Agent'] = 'prins1bap-ui-bounty-1102-readonly-smoke/1.0'
          results = []

          def get(url):
              t0=time.time()
              try:
                  r=s.get(url, timeout=20, allow_redirects=True)
                  dt=round((time.time()-t0)*1000)
                  results.append({
                      'url': url,
                      'status': r.status_code,
                      'final_url': r.url,
                      'latency_ms': dt,
                      'content_type': r.headers.get('content-type',''),
                      'bytes': len(r.content),
                      'sha256': hashlib.sha256(r.content).hexdigest(),
                  })
                  return r
              except Exception as e:
                  results.append({'url':url,'error':type(e).__name__+': '+str(e)})
                  return None

          home=get(base)
          candidates=[]
          if home is not None and home.ok:
              soup=BeautifulSoup(home.text,'html.parser')
              seen=set()
              for a in soup.find_all('a', href=True):
                  href=urldefrag(a['href'])[0].strip()
                  if not href or href.startswith(('mailto:','tel:','javascript:')):
                      continue
                  u=urljoin(base, href)
                  p=urlparse(u)
                  if p.scheme not in ('http','https') or p.netloc != 'bottube.ai':
                      continue
                  key=p.scheme+'://'+p.netloc+p.path + (('?'+p.query) if p.query else '')
                  if key not in seen:
                      seen.add(key); candidates.append(key)
              candidates=candidates[:30]

          for u in candidates:
              if u != base:
                  get(u)
                  time.sleep(0.15)

          for extra in ['https://bottube.ai/robots.txt','https://bottube.ai/sitemap.xml']:
              if extra not in [x.get('url') for x in results]:
                  get(extra)

          with open('evidence/1102-bottube-public-smoke.json','w') as f:
              json.dump({'tested_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'results':results},f,indent=2)

          broken=[x for x in results if x.get('status',200)>=400 or 'error' in x]
          with open('evidence/1102-bottube-public-smoke.md','w') as f:
              f.write('# BoTTube public smoke test for bounty #1102\n\n')
              f.write('Read-only test. No login, upload, vote, comment, mutation, fuzzing, or security testing was performed.\n\n')
              f.write(f'- URLs checked: {len(results)}\n')
              f.write(f'- Potential failures: {len(broken)}\n\n')
              f.write('| URL | Status | Final URL / Error |\n|---|---:|---|\n')
              for x in results:
                  status=x.get('status','ERR')
                  final=x.get('final_url') or x.get('error','')
                  f.write(f"| {x['url']} | {status} | {final} |\n")
          PY
      - name: Persist evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/1102-bottube-public-smoke.json evidence/1102-bottube-public-smoke.md
          if git diff --cached --quiet; then
            echo 'No smoke-test changes.'
          else
            git commit -m 'Capture BoTTube public smoke evidence for bounty 1102'
            git push
          fi
