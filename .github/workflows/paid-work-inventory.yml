name: Paid Work Inventory
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paid-work-inventory.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan public machine-readable paid-work endpoints
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, datetime, os
          targets = {
            'taskbounty_tasks':'https://www.task-bounty.com/api/v1/tasks?state=open&limit=100',
            'moltjobs_open':'https://api.moltjobs.io/v1/jobs?status=OPEN',
            'basebounty_home':'https://www.basebounty.app/',
          }
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'targets':{}}
          for k,u in targets.items():
            req=urllib.request.Request(u,headers={'User-Agent':'paid-work-inventory/1.0','Accept':'application/json,text/html'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read(200000).decode('utf-8','replace')
                out['targets'][k]={'url':u,'status':r.status,'content_type':r.headers.get('content-type'),'body':body}
            except Exception as e:
              status=getattr(e,'code',None)
              body=''
              try: body=e.read(200000).decode('utf-8','replace')
              except Exception: pass
              out['targets'][k]={'url':u,'status':status,'error':str(e),'body':body}
          os.makedirs('evidence',exist_ok=True)
          with open('evidence/paid-work-inventory.json','w') as f: json.dump(out,f,indent=2)
          PY
      - name: Persist evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/paid-work-inventory.json
          git diff --cached --quiet || git commit -m 'Refresh paid work inventory evidence'
          git push
