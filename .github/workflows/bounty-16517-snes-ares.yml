name: Bounty 16517 SNES ares QA

on:
  push:
    branches:
      - bounty-16517-snes-ares-20260911
  workflow_dispatch:

jobs:
  ares-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout operator repo
        uses: actions/checkout@v4

      - name: Install build/runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git curl xvfb cc65 libgtk-3-dev libcanberra-gtk3-module libgl-dev libasound2-dev libao-dev libopenal-dev libpulse-dev libudev-dev libxss-dev

      - name: Build SDL3
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/libsdl-org/SDL.git upstream/SDL
          cmake -S upstream/SDL -B upstream/SDL/build -DCMAKE_BUILD_TYPE=Release -DSDL_X11_XSCRNSAVER=OFF -DSDL_X11_XTEST=OFF -DSDL_X11_XFIXES=OFF -DSDL_X11_XRANDR=OFF
          cmake --build upstream/SDL/build --parallel 2
          sudo cmake --install upstream/SDL/build --prefix=/usr/local

      - name: Build independent ares SFC emulator
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/ares-emulator/ares.git upstream/ares
          cd upstream/ares
          ARES_SHA=$(git rev-parse HEAD)
          echo "ARES_SHA=$ARES_SHA" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja -DARES_CORES="sfc" -DARES_SKIP_DEPS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          test -x build/rundir/bin/ares
          cp build/rundir/bin/ares ../../ares-bin
          printf 'ARES_SHA=%s\n' "$ARES_SHA" | tee ../../snes-ares-evidence.txt
          ./build/rundir/bin/ares --version 2>&1 | tee -a ../../snes-ares-evidence.txt || true
          sha256sum build/rundir/bin/ares | tee -a ../../snes-ares-evidence.txt

      - name: Pin and build profiling benchmark
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Scottcjn/elya-snes.git upstream/elya-snes
          cd upstream/elya-snes
          git checkout 0ed1aae3e9cc900da3bc6f88a9abf1bf612f669b
          test "$(git rev-parse HEAD)" = "0ed1aae3e9cc900da3bc6f88a9abf1bf612f669b"
          SNES_FAST=0 NAME=nnprof DEFS="-DPROFILE" ./build_nn.sh
          test -f out/nnprof.sfc
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" | tee -a ../../snes-ares-evidence.txt
          sha256sum out/nnprof.sfc | tee -a ../../snes-ares-evidence.txt

      - name: Three-run SRAM determinism and token/profile gate
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream/elya-snes
          mkdir -p "$HOME/snesroms" ../../evidence
          for run in 1 2 3; do
            cp out/nnprof.sfc "$HOME/snesroms/nnprof.sfc"
            rm -f "$HOME/snesroms/nnprof.ram"
            xvfb-run -a ../../ares-bin --system "Super Famicom" --no-file-prompt "$HOME/snesroms/nnprof.sfc" > "../../evidence/ares-run-${run}.log" 2>&1 &
            pid=$!
            ok=0
            for _ in $(seq 1 100); do
              if [ -f "$HOME/snesroms/nnprof.ram" ] && [ "$(dd if="$HOME/snesroms/nnprof.ram" bs=1 skip=8 count=4 2>/dev/null)" = "DONE" ]; then ok=1; break; fi
              sleep 2
            done
            kill -KILL "$pid" >/dev/null 2>&1 || true
            pkill -x -KILL ares >/dev/null 2>&1 || true
            test "$ok" = 1
            cp "$HOME/snesroms/nnprof.ram" "../../evidence/nnprof-run-${run}.ram"
            python3 tools/check_nn.py "../../evidence/nnprof-run-${run}.ram" | tee "../../evidence/check-run-${run}.txt"
            python3 tools/prof_nn.py "../../evidence/nnprof-run-${run}.ram" | tee "../../evidence/profile-run-${run}.txt"
            sha256sum "../../evidence/nnprof-run-${run}.ram" | tee -a ../../snes-ares-evidence.txt
          done
          cmp evidence/nnprof-run-1.ram evidence/nnprof-run-2.ram
          cmp evidence/nnprof-run-1.ram evidence/nnprof-run-3.ram
          grep -R "PASS" evidence/check-run-*.txt
          printf 'DETERMINISM=3/3 byte-identical SRAM\n' | tee -a snes-ares-evidence.txt
          cat evidence/check-run-*.txt evidence/profile-run-*.txt >> snes-ares-evidence.txt

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty-16517-snes-ares-acceptance
          path: |
            snes-ares-evidence.txt
            evidence/
            upstream/elya-snes/out/nnprof.sfc
            ares-bin
          if-no-files-found: ignore
