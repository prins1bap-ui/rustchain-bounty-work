name: Bounty 16517 SNES ares QA

on:
  push:
    branches:
      - bounty-16517-snes-ares-20260911
  workflow_dispatch:

jobs:
  ares-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout operator repo
        uses: actions/checkout@v4

      - name: Install ares build/runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git curl xvfb libgtk-3-dev libcanberra-gtk3-module libgl-dev libasound2-dev libao-dev libopenal-dev libpulse-dev libudev-dev
          cmake --version

      - name: Build independent ares SFC emulator
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/ares-emulator/ares.git upstream/ares
          cd upstream/ares
          ARES_SHA=$(git rev-parse HEAD)
          echo "ARES_SHA=$ARES_SHA" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja -DARES_CORES="sfc" -DARES_SKIP_DEPS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          test -x build/rundir/bin/ares
          cp build/rundir/bin/ares ../../ares-bin
          printf 'ARES_SHA=%s\n' "$ARES_SHA" | tee ../../snes-ares-preflight.txt
          ./build/rundir/bin/ares --version 2>&1 | tee -a ../../snes-ares-preflight.txt || true
          sha256sum build/rundir/bin/ares | tee -a ../../snes-ares-preflight.txt

      - name: Pin upstream SNES benchmark
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Scottcjn/elya-snes.git upstream/elya-snes
          cd upstream/elya-snes
          git checkout 0ed1aae3e9cc900da3bc6f88a9abf1bf612f669b
          test "$(git rev-parse HEAD)" = "0ed1aae3e9cc900da3bc6f88a9abf1bf612f669b"
          test -f out/nn.sfc
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" | tee -a ../../snes-ares-preflight.txt
          sha256sum out/nn.sfc | tee -a ../../snes-ares-preflight.txt
          cp out/nn.sfc ../../nn.sfc

      - name: Headless ROM smoke test
        shell: bash
        run: |
          set -euxo pipefail
          timeout 10s xvfb-run -a ./ares-bin --system "Super Famicom" "$PWD/nn.sfc" > ares-smoke.log 2>&1 || rc=$?
          rc=${rc:-0}
          echo "smoke_exit=$rc" | tee -a snes-ares-preflight.txt
          tail -100 ares-smoke.log | tee -a snes-ares-preflight.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty-16517-snes-ares-preflight
          path: |
            snes-ares-preflight.txt
            ares-smoke.log
            nn.sfc
            ares-bin
          if-no-files-found: ignore
