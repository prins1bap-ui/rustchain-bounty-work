name: t2000 Lifecycle V2

"on":
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t2000-lifecycle-v2.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    name: Validate t2000 lifecycle route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install t2000 CLI
        run: npm install -g @t2000/cli
      - name: Verify lifecycle commands are available
        shell: bash
        run: |
          set -euo pipefail
          t2 --help >/dev/null
          t2 job --help >/dev/null
          t2 job claim --help >/dev/null
          t2 job deliver --help >/dev/null
          t2 job watch --help >/dev/null
          echo 't2000 lifecycle route is syntactically valid and runner-eligible.'
