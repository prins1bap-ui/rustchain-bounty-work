name: Clawlancer agent bootstrap

on:
  push:
    paths:
      - '.github/workflows/clawlancer-agent-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register one agent and capture live bounty inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clawlancer-agent
          cat > /tmp/clawlancer.py <<'PY'
          import json, urllib.request, urllib.error, os, re, subprocess, tempfile

          BASE='https://clawlancer.ai/api'
          payload={
              'name':'BAP2686Worker',
              'bio':'Autonomous research, writing, coding, QA, documentation, and data agent. Non-security work only.'
          }

          def request(url, method='GET', body=None, token=None):
              headers={'Accept':'application/json','User-Agent':'BAP2686Worker/1.0'}
              data=None
              if body is not None:
                  data=json.dumps(body).encode()
                  headers['Content-Type']='application/json'
              if token:
                  headers['Authorization']='Bearer '+token
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace')
                      return r.status, json.loads(raw) if raw.strip() else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: parsed=json.loads(raw)
                  except: parsed={'error_text':raw[:1000]}
                  return e.code, parsed

          status, reg=request(BASE+'/agents/register','POST',payload)
          if status < 200 or status >= 300:
              # Do not retry registration with alternate schemas: avoid accidental duplicate identities.
              with open('clawlancer-agent/bootstrap-error.json','w') as f:
                  json.dump({'status':status,'error':reg},f,indent=2)
              raise SystemExit('Registration failed; no retry attempted.')

          def walk(obj, path=''):
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      p=(path+'.'+k).strip('.')
                      yield p,k,v
                      yield from walk(v,p)
              elif isinstance(obj,list):
                  for i,v in enumerate(obj):
                      yield from walk(v,f'{path}[{i}]')

          api_key=None
          api_path=None
          for path,k,v in walk(reg):
              kl=k.lower()
              if isinstance(v,str) and kl in ('api_key','apikey','api-key','agent_api_key') and v:
                  api_key=v; api_path=path; break
          if not api_key:
              # Fallback only to token fields that clearly belong to the agent API, never arbitrary auth material.
              for path,k,v in walk(reg):
                  kl=k.lower()
                  if isinstance(v,str) and ('api' in path.lower() and ('token' in kl or 'key' in kl)) and v:
                      api_key=v; api_path=path; break
          if not api_key:
              with open('clawlancer-agent/bootstrap-error.json','w') as f:
                  json.dump({'status':status,'reason':'No API key field recognized','top_level_keys':list(reg.keys()) if isinstance(reg,dict) else []},f,indent=2)
              raise SystemExit('Registration succeeded but API key field was not recognized.')

          # Mask before any logging.
          print('::add-mask::'+api_key)

          # Encrypt API key with a public RSA key. Private key never enters GitHub.
          pub='''-----BEGIN PUBLIC KEY-----
MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA1MnziMROngZBR/UvBcsN
lary3FQjB2aT/5kNhi0ED0p0UZduIznDg5dqyF+rPjZcqBe++NlPe7Pu590C3jod
jti+aiOwiMEcbWLgJH/FYLr3H8I0aUypCHhm4aMwNpQPyZS1E+LHOGIcPdwO41OK
Hw1nd+9u+/QmgyzY4A2M9kuMizRWu8gcrYaeGwYn8XJXLKrfxX6DTNC7F3vBP42d
w7t1RSPSv2CKyCL2gpu7R+07pZbvHJTsjtir/Q19OZrfKyEIv+MOnkZJTAIE1RGJ
i8OJFTNcrUL055z8YByH2Bveig/J+kSrJH9xL4tFqJpUN4tN+CODqQIYpuzn9LuX
rOu/gIMIOmpU6UIwGle0NR689Fa3ebKb6dG6TM6a+yIC/v19jFY8QFp/z+qmELoh
ego8PvM7qgpbnHa/sqkr7sf+k6OTUcDD+yBfu9aW5VHwfw8oJID+VNxvZpWfbTTT
z7bIei0TTMf+YxISESPi4O1AtMsmpjWybNs97UDnuIiDAgMBAAE=
-----END PUBLIC KEY-----
'''
          with open('/tmp/clawlancer-public.pem','w') as f: f.write(pub)
          p=subprocess.run(
              ['openssl','pkeyutl','-encrypt','-pubin','-inkey','/tmp/clawlancer-public.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],
              input=api_key.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True
          )
          import base64
          with open('clawlancer-agent/api-key.enc.b64','w') as f:
              f.write(base64.b64encode(p.stdout).decode()+'\n')

          # Redact anything secret-looking from public metadata.
          def redact(obj):
              if isinstance(obj,dict):
                  out={}
                  for k,v in obj.items():
                      kl=k.lower()
                      if any(x in kl for x in ('api_key','apikey','token','secret','mnemonic','private_key','password')):
                          continue
                      out[k]=redact(v)
                  return out
              if isinstance(obj,list): return [redact(x) for x in obj]
              return obj

          public=redact(reg)
          public['_bootstrap']={'agent_name':'BAP2686Worker','registration_status':status,'api_key_encrypted':True}
          with open('clawlancer-agent/agent-public-meta.json','w') as f:
              json.dump(public,f,indent=2,sort_keys=True)

          # Fetch live bounties after registration. Read-only and no spend.
          lstatus,listings=request(BASE+'/listings?listing_type=BOUNTY','GET',token=api_key)
          def compact(x):
              if not isinstance(x,dict): return x
              keep=('id','title','description','listing_type','category','price','price_usdc','price_wei','status','state','created_at','deadline','seller_id','claimed','claimable','transaction_id')
              return {k:x.get(k) for k in keep if k in x}
          rows=[]
          source=listings
          if isinstance(listings,dict):
              for key in ('listings','data','items','results'):
                  if isinstance(listings.get(key),list): source=listings[key]; break
          if isinstance(source,list): rows=[compact(x) for x in source]
          elif isinstance(source,dict): rows=[compact(source)]
          inventory={'status':lstatus,'count':len(rows),'bounties':rows}
          with open('clawlancer-agent/live-bounties.json','w') as f:
              json.dump(inventory,f,indent=2,sort_keys=True)
          print('Registration succeeded. Live bounty rows captured:',len(rows))
          PY
          python /tmp/clawlancer.py

      - name: Commit encrypted credential and public inventory
        shell: bash
        run: |
          git config user.name 'bap2686-bounty-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add clawlancer-agent/api-key.enc.b64 clawlancer-agent/agent-public-meta.json clawlancer-agent/live-bounties.json clawlancer-agent/bootstrap-error.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bootstrap Clawlancer agent and capture live bounty inventory'
          git push
