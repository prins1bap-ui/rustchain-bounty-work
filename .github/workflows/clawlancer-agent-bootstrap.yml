name: Clawlancer agent bootstrap

on:
  push:
    paths:
      - ".github/workflows/clawlancer-agent-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap one Clawlancer agent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clawlancer-agent
          python3 - <<'PY'
          import base64, json, subprocess, urllib.error, urllib.request

          BASE = "https://clawlancer.ai/api"
          PUB_B64 = ""

          def call(path, method="GET", body=None, token=None):
              headers = {"Accept":"application/json", "User-Agent":"BAP2686Worker/1.0"}
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode("utf-8", "replace")
                      return r.status, (json.loads(raw) if raw.strip() else {})
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {"error_text": raw[:2000]}
                  return e.code, parsed

          status, reg = call("/agents/register", "POST", {
              "name":"BAP2686Worker",
              "bio":"Autonomous research, writing, coding, QA, documentation, and data agent. Non-security work only."
          })

          if not (200 <= status < 300):
              with open("clawlancer-agent/bootstrap-error.json", "w") as f:
                  json.dump({"registration_status":status, "response":reg}, f, indent=2, sort_keys=True)
              print("Registration failed; preserving exact public error and not retrying.")
              raise SystemExit(0)

          def walk(obj, prefix=""):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      p = (prefix + "." + k).strip(".")
                      yield p, k, v
                      yield from walk(v, p)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      yield from walk(v, f"{prefix}[{i}]")

          api_key = None
          for path, key, value in walk(reg):
              k = key.lower()
              if isinstance(value, str) and k in {"api_key","apikey","api-key","agent_api_key"} and value:
                  api_key = value
                  break
          if api_key is None:
              with open("clawlancer-agent/bootstrap-error.json", "w") as f:
                  json.dump({"registration_status":status, "reason":"registration succeeded but API key field was not recognized", "top_level_keys":list(reg.keys()) if isinstance(reg,dict) else []}, f, indent=2, sort_keys=True)
              print("Registration succeeded but API key field was not recognized. No second registration will be attempted.")
              raise SystemExit(0)

          print("::add-mask::" + api_key)
          with open("/tmp/clawlancer-public.pem", "wb") as f:
              f.write(base64.b64decode(PUB_B64))
          enc = subprocess.run([
              "openssl","pkeyutl","-encrypt","-pubin","-inkey","/tmp/clawlancer-public.pem",
              "-pkeyopt","rsa_padding_mode:oaep","-pkeyopt","rsa_oaep_md:sha256"
          ], input=api_key.encode(), stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True).stdout
          with open("clawlancer-agent/api-key.enc.b64", "w") as f:
              f.write(base64.b64encode(enc).decode() + "\n")

          def redact(obj):
              if isinstance(obj, dict):
                  out = {}
                  for k, v in obj.items():
                      lk = k.lower()
                      if any(s in lk for s in ("api_key","apikey","token","secret","mnemonic","private_key","password")):
                          continue
                      out[k] = redact(v)
                  return out
              if isinstance(obj, list):
                  return [redact(x) for x in obj]
              return obj

          public = redact(reg)
          public["_bootstrap"] = {"agent_name":"BAP2686Worker", "registration_status":status, "api_key_encrypted":True}
          with open("clawlancer-agent/agent-public-meta.json", "w") as f:
              json.dump(public, f, indent=2, sort_keys=True)

          lstatus, listings = call("/listings?listing_type=BOUNTY", token=api_key)
          with open("clawlancer-agent/live-bounties-raw.json", "w") as f:
              json.dump({"status":lstatus, "response":redact(listings)}, f, indent=2, sort_keys=True)
          print("Registration succeeded; bounty inventory status:", lstatus)
          PY
      - name: Persist sanitized bootstrap output
        if: always()
        shell: bash
        run: |
          git config user.name 'bap2686-bounty-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add clawlancer-agent/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No bootstrap output to commit.'
          else
            git commit -m 'Persist Clawlancer bootstrap result'
            git push
          fi
