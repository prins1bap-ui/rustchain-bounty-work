name: RIP-302 Go Client QA

on:
  push:
    branches:
      - rip302-go-client-20260908
    paths:
      - 'submissions/rip302-go-client/**'
      - '.github/workflows/rip302-go-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submissions/rip302-go-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Format smoke
        run: gofmt -w .
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
