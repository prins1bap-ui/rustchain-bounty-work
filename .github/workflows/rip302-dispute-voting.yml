name: RIP-302 Dispute Voting QA

on:
  push:
    branches:
      - rip302-dispute-voting-20260908
    paths:
      - 'submissions/rip302-dispute-voting/**'
      - '.github/workflows/rip302-dispute-voting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submissions/rip302-dispute-voting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m py_compile dispute_voting.py test_dispute_voting.py
      - name: Test
        run: pytest -q
