name: RIP-302 Auto Matcher QA

on:
  push:
    branches:
      - rip302-auto-matcher-20260908
    paths:
      - 'submissions/rip302-auto-matcher/**'
      - '.github/workflows/rip302-auto-matcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submissions/rip302-auto-matcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m py_compile matcher.py test_matcher.py
      - name: Test
        run: pytest -q
