name: Frantic MCP discovery

on:
  push:
    paths:
      - '.github/workflows/frantic-mcp-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Frantic MCP read-only
        shell: bash
        run: |
          mkdir -p frantic-agent
          cat > /tmp/frantic_discover.py <<'PY'
          import json, urllib.request, urllib.error

          URL='https://api.gofrantic.com/mcp'

          def decode(raw, ctype=''):
              text=raw.decode('utf-8','replace')
              if 'text/event-stream' in ctype or text.lstrip().startswith(('event:','data:')):
                  vals=[]
                  for line in text.splitlines():
                      if line.startswith('data:'):
                          s=line[5:].strip()
                          if s and s!='[DONE]':
                              try: vals.append(json.loads(s))
                              except Exception: vals.append({'raw':s[:4000]})
                  return vals[-1] if vals else {'raw':text[:4000]}
              try: return json.loads(text)
              except Exception: return {'raw':text[:4000]}

          def post(payload, session=None):
              h={'Content-Type':'application/json','Accept':'application/json, text/event-stream','User-Agent':'bap2686-frantic-readonly/1.1'}
              if session: h['Mcp-Session-Id']=session
              req=urllib.request.Request(URL,data=json.dumps(payload).encode(),headers=h,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return decode(r.read(),r.headers.get('Content-Type','')), r.headers.get('Mcp-Session-Id') or session, r.status
              except urllib.error.HTTPError as e:
                  return {'http_error':e.code,'body':decode(e.read(),e.headers.get('Content-Type',''))}, session, e.code
              except Exception as e:
                  return {'error':type(e).__name__,'message':str(e)}, session, None

          report={'endpoint':URL,'mode':'read-only','initialize':None,'tools':[],'board':None,'errors':[]}
          init={'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-03-26','capabilities':{},'clientInfo':{'name':'bap2686-frantic-readonly','version':'1.1'}}}
          ir,session,status=post(init)
          report['initialize']={'status':status,'response':ir}
          if not (status and 200<=status<300):
              report['errors'].append('initialize failed')
          else:
              post({'jsonrpc':'2.0','method':'notifications/initialized','params':{}},session)
              tr,session,ts=post({'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}},session)
              tools=((tr.get('result') or {}).get('tools') or []) if isinstance(tr,dict) else []
              report['tools']=[{'name':t.get('name'),'description':t.get('description'),'inputSchema':t.get('inputSchema')} for t in tools if isinstance(t,dict)]
              report['tools_status']=ts
              read_tools=[t for t in tools if isinstance(t,dict) and str(t.get('name','')).endswith('.read_board')]
              if not read_tools:
                  report['board']={'skipped':True,'reason':'namespaced read_board not advertised'}
              else:
                  t=read_tools[0]
                  schema=t.get('inputSchema') or {}
                  required=schema.get('required') or []
                  if required:
                      report['board']={'skipped':True,'reason':'read_board unexpectedly requires args','required':required}
                  else:
                      br,session,bs=post({'jsonrpc':'2.0','id':3,'method':'tools/call','params':{'name':t['name'],'arguments':{}}},session)
                      report['board']={'status':bs,'response':br}
          with open('frantic-agent/mcp-discovery.json','w') as f: json.dump(report,f,indent=2,sort_keys=True)
          print('Tools:',[t.get('name') for t in report.get('tools',[])])
          print('Board status:',(report.get('board') or {}).get('status'))
          PY
          python /tmp/frantic_discover.py
      - name: Commit sanitized discovery result
        shell: bash
        run: |
          git config user.name 'bap2686-bounty-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add frantic-agent/mcp-discovery.json
          if git diff --cached --quiet; then
            echo 'No discovery changes to commit.'
          else
            git commit -m 'Capture Frantic MCP public bounty board'
            git push
          fi
