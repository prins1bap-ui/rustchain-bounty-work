name: Cash Live Feed Probe

on:
  push:
    branches: [cash-live-feeds-20260914]
    paths: [.github/workflows/cash-live-feeds.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cash-live-feeds-20260914
      - name: Fetch public money feeds and safe sandbox metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/cash_probe

          # Vibes-Coded public earning feeds
          curl -fsS --max-time 30 'https://vibes-coded.com/api/v1/agent-feed' -o ops/cash_probe/vibes_agent_feed.json || true
          curl -fsS --max-time 30 'https://vibes-coded.com/api/v1/jobs-feed' -o ops/cash_probe/vibes_jobs_feed.json || true
          curl -fsS --max-time 30 'https://vibes-coded.com/api/jobs/meta' -o ops/cash_probe/vibes_jobs_meta.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('ops/cash_probe/vibes_agent_feed.json')
          if p.exists() and p.stat().st_size:
              d=json.loads(p.read_text())
              Path('ops/cash_probe/vibes_jobs_lane.json').write_text(json.dumps(d.get('jobs_lane',{}),indent=2)+'\n')
          PY

          # MoltJobs public contract/reward discovery. No credentials, no writes.
          curl -fsS --max-time 30 'https://api.moltjobs.io/v1/forum/guide' -o ops/cash_probe/molt_forum_guide.json || true
          curl -fsS --max-time 30 'https://api.moltjobs.io/v1/forum/categories' -o ops/cash_probe/molt_forum_categories.json || true
          curl -fsS --max-time 30 'https://api.moltjobs.io/v1/forum/rewards' -o ops/cash_probe/molt_forum_rewards.json || true
          curl -fsS --max-time 30 'https://api.moltjobs.io/v1/jobs?status=OPEN&limit=100' -o ops/cash_probe/molt_open_jobs.json || true
          curl -fsS --max-time 30 'https://api.moltjobs.io/v1/stats' -o ops/cash_probe/molt_stats.json || true

          # ReReady authorized sandbox, passive/read-only safety checks only.
          curl -fsS -D ops/cash_probe/reready_signin_headers.txt -o /dev/null --max-time 30 'https://sandbox.reready.co/users/sign_in' || true
          curl -fsS -D ops/cash_probe/reready_signup_headers.txt -o /dev/null --max-time 30 'https://sandbox.reready.co/users/sign_up' || true
          curl -sS -D ops/cash_probe/reready_api_cors_headers.txt -o /dev/null --max-time 30 -H 'Origin: https://attacker.example' 'https://sandbox.reready.co/api/v1/device_transfers' || true
          curl -sS -D ops/cash_probe/reready_api_preflight_headers.txt -o /dev/null --max-time 30 -X OPTIONS -H 'Origin: https://attacker.example' -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: authorization' 'https://sandbox.reready.co/api/v1/device_transfers' || true
          for p in 'robots.txt' 'sitemap.xml' '.well-known/security.txt'; do
            curl -sS --max-time 20 "https://sandbox.reready.co/$p" -o "ops/cash_probe/reready_${p//\//_}" || true
          done
          : > ops/cash_probe/reready_safe_routes.tsv
          for p in '.git/config' '.env' 'rails/info/routes' 'sidekiq' 'admin' 'api-docs' 'openapi.json' 'swagger.json' 'rails/active_storage/direct_uploads'; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://sandbox.reready.co/$p" || true)
            printf '%s\t%s\n' "$code" "$p" >> ops/cash_probe/reready_safe_routes.tsv
          done
      - name: Persist public results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/cash_probe
          git diff --cached --quiet || git commit -m 'cash: refresh public earning feeds and sandbox metadata'
          git push origin HEAD:cash-live-feeds-20260914
