name: Beacon RTC Watchdog QA

on:
  push:
    branches:
      - beacon-rtc-watchdog-20260908
    paths:
      - 'submissions/beacon-rtc-watchdog/**'
      - '.github/workflows/beacon-rtc-watchdog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submissions/beacon-rtc-watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beacon-skill pytest
      - name: Compile
        run: python -m py_compile rtc_watchdog.py test_rtc_watchdog.py
      - name: Assessment tests
        run: pytest -q test_rtc_watchdog.py -k 'pending_inside_window or stale_pending or settled_rows or invalid_snapshot or invalid_pending'
      - name: Serialization integration test
        run: pytest -q test_rtc_watchdog.py -k 'run_once_serializes'
