# Trigger refreshed 2026-09-03
name: Apify Precloud Live Smoke QA

on:
  push:
    branches:
      - apify-bridge-20260902
    paths:
      - '.github/workflows/apify-precloud-live-smoke.yml'
      - 'ops/pilot_input.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct scanner
        working-directory: apify_actor
        run: |
          cat src/scanner_parts/part1.part src/scanner_parts/part2.part src/scanner_parts/part3.part src/scanner_parts/part4.part > src/scanner.py
          echo "da1ed025db4551c69b3e42f3387a1036ec3be51507f026363f4d92fe30581865  src/scanner.py" | sha256sum -c -

      - name: Install runtime dependencies
        working-directory: apify_actor
        run: pip install -r requirements.txt

      - name: Run zero-cost pilot fulfillment
        working-directory: apify_actor
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from src.scanner import audit_url, deduplicate_urls
          from src.public_transport import public_client_factory

          payload = json.loads(Path('../ops/pilot_input.json').read_text(encoding='utf-8'))
          raw_urls = payload.get('urls') or []
          urls, duplicate_count = deduplicate_urls(raw_urls[:250])
          results = [audit_url(url, timeout_seconds=10, max_retries=1, client_factory=public_client_factory) for url in urls]

          out = Path('../pilot_output')
          out.mkdir(exist_ok=True)
          (out / 'results.json').write_text(json.dumps(results, indent=2, sort_keys=True), encoding='utf-8')

          fields = ['requestedUrl','normalizedUrl','finalUrl','statusCode','redirectCount','status','errorCode','errorMessage','title','metaDescription','generator','language','canonicalUrl','organizationName','detectedTechnologies','forms','emails','phones','socialProfiles','https','server','contentType','bytesRead']
          with open(out / 'results.csv', 'w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              writer.writeheader()
              for row in results:
                  item = dict(row)
                  for key in ('detectedTechnologies','emails','phones'):
                      item[key] = '; '.join(item.get(key) or [])
                  item['socialProfiles'] = json.dumps(item.get('socialProfiles') or {}, sort_keys=True)
                  writer.writerow(item)

          success_count = sum(r.get('status') == 'SUCCESS' for r in results)
          error_count = len(results) - success_count
          summary = {
              'status': 'PASS' if success_count >= 1 else 'FAIL',
              'processed_unique_count': len(results),
              'success_count': success_count,
              'error_count': error_count,
              'duplicate_count': duplicate_count,
              'apify_cloud_calls_made': 0,
              'paid_actions_made': 0
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(summary, sort_keys=True))
          if summary['status'] != 'PASS':
              raise SystemExit(1)
          PY

      - name: Upload sanitized pilot output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apify-precloud-live-smoke-result
          path: pilot_output/
          if-no-files-found: warn
          retention-days: 7
