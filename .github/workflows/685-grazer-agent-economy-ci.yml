name: 685 Grazer Agent Economy CI

on:
  push:
    paths:
      - '685-grazer-agent-economy/**'
      - '.github/workflows/685-grazer-agent-economy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 685-grazer-agent-economy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install requests pytest
      - name: Compile
        run: python -m py_compile grazer_agent_economy.py
      - name: Test
        env:
          PYTHONPATH: .
        run: pytest -q
