name: Bounty 16517 Genesis Plus GX QA

on:
  push:
    branches: [bounty-16517-genesis-gpgx-20260911]
    paths:
      - '.github/workflows/bounty-16517-genesis-gpgx.yml'
      - '16517-genesis-gpgx/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git make gcc g++ python3 zlib1g-dev
          docker --version

      - name: Prepare exact historical Genesis benchmark
        run: |
          set -euxo pipefail
          git clone https://github.com/Scottcjn/legend-of-elya-genesis.git genesis-main
          cp -a genesis-main genesis-hist
          cd genesis-hist
          git checkout 6b5ce98e44bb07e9156291ffd470ff7371e170e9
          test "$(git rev-parse HEAD)" = "6b5ce98e44bb07e9156291ffd470ff7371e170e9"
          rm -rf bench
          cp -a ../genesis-main/bench ./bench
          rm -f bench/src/elya_gpt.c bench/src/elya_gpt.h bench/src/elya_router.h
          cp src/elya_gpt.c src/elya_gpt.h src/elya_router.h bench/src/
          cp res/elya_brain_w16.bin bench/res/model.bin
          cd ..
          printf 'SOURCE_SHA=6b5ce98e44bb07e9156291ffd470ff7371e170e9\n' | tee evidence.txt

      - name: Build benchmark ROM and resolve RAM symbols
        run: |
          set -euxo pipefail
          docker pull ghcr.io/stephane-d/sgdk:latest
          chmod -R a+rwX genesis-hist/bench
          docker run --rm -v "$PWD/genesis-hist/bench:/src" ghcr.io/stephane-d/sgdk:latest
          test -s genesis-hist/bench/out/rom.bin
          test -s genesis-hist/bench/out/symbol.txt
          sha256sum genesis-hist/bench/out/rom.bin | tee -a evidence.txt
          grep -E 'bench_(marker|expert|status|ntok|tok)' genesis-hist/bench/out/symbol.txt | tee symbols.txt
          test "$(grep -c bench_marker symbols.txt)" -ge 1
          test "$(grep -c bench_tok symbols.txt)" -ge 1
          test "$(grep -c bench_status symbols.txt)" -ge 1

      - name: Build pinned independent Genesis Plus GX libretro core
        run: |
          set -euxo pipefail
          git clone https://github.com/libretro/Genesis-Plus-GX.git gpgx
          cd gpgx
          git checkout a7985a9c4278ac352f8ca7bb4d3cc6b36e9e3e7d
          test "$(git rev-parse HEAD)" = "a7985a9c4278ac352f8ca7bb4d3cc6b36e9e3e7d"
          make -f Makefile.libretro -j2
          test -s genesis_plus_gx_libretro.so
          printf 'GPGX_SHA=%s\n' "$(git rev-parse HEAD)" | tee -a ../evidence.txt
          sha256sum genesis_plus_gx_libretro.so | tee -a ../evidence.txt

      - name: Verify independent timing and work-RAM instrumentation surface
        run: |
          set -euxo pipefail
          {
            echo '# Genesis Plus GX instrumentation surface'
            echo '## m68k cycle counter references'
            grep -R -n -E 'm68k\.cycles' gpgx/core | head -80
            echo '## work RAM mapping references'
            grep -R -n -E 'work_ram|memory_map' gpgx/core/genesis.c | head -120
          } | tee gpgx-instrumentation-surface.txt
          grep -q 'm68k.cycles' gpgx-instrumentation-surface.txt
          grep -q 'work_ram' gpgx-instrumentation-surface.txt
          printf 'BUILD_QA=PASS: pinned independent core + historical benchmark + cycle/RAM instrumentation surface\n' | tee -a evidence.txt

      - name: Execute benchmark in Genesis Plus GX and read work RAM
        run: |
          set -euxo pipefail
          python3 16517-genesis-gpgx/run_libretro_bench.py \
            --core gpgx/genesis_plus_gx_libretro.so \
            --rom genesis-hist/bench/out/rom.bin \
            --symbols genesis-hist/bench/out/symbol.txt \
            --max-frames 36000 \
            --out gpgx-execution.json | tee gpgx-execution.log
          grep -q 'EXECUTION_QA=PASS' gpgx-execution.log
          printf 'EXECUTION_QA=PASS: benchmark reached result marker in independent emulator with >=16 tokens\n' | tee -a evidence.txt

      - name: Upload pivot QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty-16517-genesis-gpgx-build-qa
          path: |
            evidence.txt
            symbols.txt
            gpgx-instrumentation-surface.txt
            gpgx-execution.json
            gpgx-execution.log
            genesis-hist/bench/out/rom.bin
            genesis-hist/bench/out/symbol.txt
            gpgx/genesis_plus_gx_libretro.so
          if-no-files-found: warn
