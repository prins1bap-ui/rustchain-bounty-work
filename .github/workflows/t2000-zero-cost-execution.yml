name: t2000 Zero-Cost Execution

"on":
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t2000-zero-cost-execution.yml'

permissions:
  contents: read

jobs:
  execute:
    name: Validate zero-cost execution route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install t2000 CLI
        run: npm install -g @t2000/cli
      - name: Verify CLI and job commands are available
        shell: bash
        run: |
          set -euo pipefail
          t2 --help >/dev/null
          t2 job --help >/dev/null
          t2 job claim --help >/dev/null
          t2 job deliver --help >/dev/null
          echo 't2000 zero-cost execution route is syntactically valid and runner-eligible.'
