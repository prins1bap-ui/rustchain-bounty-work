name: Agent Bounties Ready Inventory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/agentbounties-ready-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query ready-to-earn opportunities
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, datetime, os
          urls=[
            'https://api.agentbounties.app/v1/opportunities?view=ready_to_earn&limit=100',
            'https://api.agentbounties.app/v1/base/autonomous-bounties/feed?network=base-mainnet&claimable_only=true'
          ]
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'platform':'Agent Bounties','money_spent':False,'wallet_created':False,'queries':[]}
          for url in urls:
            req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'paid-work-inventory/1.0','X-Agent-Bounties-Interface':'api'})
            e={'url':url}
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read(2000000).decode('utf-8','replace'); e['http_status']=r.status
                try: e['body']=json.loads(raw)
                except Exception: e['raw_output']=raw[:200000]
            except urllib.error.HTTPError as x:
              e['http_status']=x.code; e['error']=x.read(100000).decode('utf-8','replace')[:100000]
            except Exception as x:
              e['error']=type(x).__name__+': '+str(x)
            out['queries'].append(e)
          os.makedirs('evidence',exist_ok=True)
          json.dump(out,open('evidence/agentbounties-ready-inventory.json','w'),indent=2)
          PY
      - name: Persist evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/agentbounties-ready-inventory.json
          git diff --cached --quiet || git commit -m 'Refresh Agent Bounties ready inventory evidence'
          git push
