name: RTC Preflight Queue

on:
  workflow_dispatch:
  push:
    paths:
      - "ops/rtc_preflight.py"
      - "ops/rtc_queue_sanitize.py"
      - ".github/workflows/rtc-preflight.yml"

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: rtc-preflight-main
  cancel-in-progress: true

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate preflight source
        run: |
          python3 -m py_compile ops/rtc_preflight.py
          python3 -m py_compile ops/rtc_queue_sanitize.py

      - name: Build authoritative candidate queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ops/rtc_preflight.py
          python3 ops/rtc_queue_sanitize.py

      - name: Validate generated queue
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/rtc-candidate-queue.json')
          data = json.loads(p.read_text())
          assert data.get('generated_at'), 'missing generated_at'
          assert isinstance(data.get('candidates'), list), 'missing candidates list'
          assert data.get('candidate_count') == len(data['candidates']), 'candidate count mismatch'
          assert 'Scottcjn-authored' in data.get('source', ''), 'queue is not definition-filtered'
          assert data.get('sanitizer', {}).get('policy_version') == 2, 'queue was not normalized'
          assert all(
              float(c.get('reward_rtc') or 0) <= max(
                  float(c.get('reward_title_rtc') or 0),
                  float(c.get('reward_body_rtc') or 0),
              )
              for c in data['candidates']
          ), 'reward inflation detected'
          identities = {(c.get('repository'), c.get('number')) for c in data['candidates']}
          assert len(identities) == len(data['candidates']), 'duplicate candidate identities'
          assert all(c.get('title') for c in data['candidates']), 'blank candidate title'
          print(
              f"validated {data['candidate_count']} candidates; "
              f"final_verify={data.get('final_verify_count', 0)}"
          )
          PY

      - name: Persist latest queue without merge conflicts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "rtc-preflight[bot]"
          git config user.email "rtc-preflight[bot]@users.noreply.github.com"

          regenerate() {
            python3 -m py_compile ops/rtc_preflight.py
            python3 -m py_compile ops/rtc_queue_sanitize.py
            python3 ops/rtc_preflight.py
            python3 ops/rtc_queue_sanitize.py
          }

          for attempt in 1 2 3; do
            # Generated queues are disposable. Never rebase/merge them against a
            # concurrently generated queue because that manufactures conflicts.
            # Reset to the latest authoritative main, regenerate, then try one
            # fast-forward commit. If another writer wins the race, repeat.
            git fetch origin main
            git reset --hard origin/main
            regenerate
            git add artifacts/rtc-candidate-queue.json artifacts/rtc-candidate-queue.md

            if git diff --cached --quiet; then
              echo "Queue already current"
              exit 0
            fi

            git commit -m "Update RTC preflight candidate queue [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update detected; regenerating from latest main (attempt $attempt/3)"
            sleep $((attempt * 2))
          done

          echo "Failed to persist queue after 3 clean regeneration attempts" >&2
          exit 1

      - name: Upload candidate queue
        uses: actions/upload-artifact@v4
        with:
          name: rtc-candidate-queue
          path: |
            artifacts/rtc-candidate-queue.json
            artifacts/rtc-candidate-queue.md
          if-no-files-found: error
