name: RTC Preflight Queue

on:
  workflow_dispatch:
  push:
    paths:
      - "ops/rtc_preflight.py"
      - "ops/rtc_queue_sanitize.py"
      - ".github/workflows/rtc-preflight.yml"

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: rtc-preflight-main
  cancel-in-progress: true

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic scanner hotfixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ops/rtc_preflight.py')
          text = p.read_text()
          buggy = '                title=title,\n                url=issue.get("html_url") or "",'
          fixed = '                title=issue.get("title") or "",\n                url=issue.get("html_url") or "",'
          if buggy in text:
              text = text.replace(buggy, fixed, 1)
              p.write_text(text)
              print('fixed stale candidate-title binding')
          elif fixed in text:
              print('candidate-title binding already fixed')
          else:
              raise SystemExit('candidate-title binding pattern not found; fail closed')
          PY

      - name: Validate preflight source
        run: |
          python3 -m py_compile ops/rtc_preflight.py
          python3 -m py_compile ops/rtc_queue_sanitize.py

      - name: Build authoritative candidate queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/rtc_preflight.py

      - name: Normalize reward and opportunity records
        run: python3 ops/rtc_queue_sanitize.py

      - name: Validate generated queue
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/rtc-candidate-queue.json')
          data = json.loads(p.read_text())
          assert data.get('generated_at'), 'missing generated_at'
          assert isinstance(data.get('candidates'), list), 'missing candidates list'
          assert data.get('candidate_count') == len(data['candidates']), 'candidate count mismatch'
          assert 'Scottcjn-authored' in data.get('source', ''), 'queue is not definition-filtered'
          assert data.get('sanitizer', {}).get('policy_version') == 2, 'queue was not normalized'
          assert all(float(c.get('reward_rtc') or 0) <= max(float(c.get('reward_title_rtc') or 0), float(c.get('reward_body_rtc') or 0)) for c in data['candidates'])
          assert len({(c.get('repository'), c.get('number'), c.get('title')) for c in data['candidates']}) == len(data['candidates']), 'duplicate candidate identity/title tuples'
          print(f"validated {data['candidate_count']} candidates; final_verify={data.get('final_verify_count', 0)}")
          PY

      - name: Persist latest queue and scanner fixes in repository
        run: |
          git config user.name "rtc-preflight[bot]"
          git config user.email "rtc-preflight[bot]@users.noreply.github.com"
          git add ops/rtc_preflight.py artifacts/rtc-candidate-queue.json artifacts/rtc-candidate-queue.md
          if git diff --cached --quiet; then
            echo "Queue and scanner unchanged"
            exit 0
          fi

          git commit -m "Update RTC preflight queue and scanner fixes [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to persist queue after 3 race-safe attempts" >&2
          exit 1

      - name: Upload candidate queue
        uses: actions/upload-artifact@v4
        with:
          name: rtc-candidate-queue
          path: |
            artifacts/rtc-candidate-queue.json
            artifacts/rtc-candidate-queue.md
          if-no-files-found: error
