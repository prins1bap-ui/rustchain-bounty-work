name: RTC wallet balance verification

on:
  push:
    paths:
      - '.github/workflows/rustchain-wallet-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query public RustChain wallet balance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          URL='https://rustchain.org/wallet/balance?miner_id=RTCc5449fe1b93385961152720c864c0f073dae5855'
          curl --fail --silent --show-error --location "$URL" > evidence/rtc-wallet-balance.json
          python -m json.tool evidence/rtc-wallet-balance.json > evidence/rtc-wallet-balance.pretty.json
          mv evidence/rtc-wallet-balance.pretty.json evidence/rtc-wallet-balance.json
      - name: Persist balance evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/rtc-wallet-balance.json
          if git diff --cached --quiet; then
            echo 'No balance change.'
          else
            git commit -m 'Capture current RTC wallet balance'
            git push
          fi
