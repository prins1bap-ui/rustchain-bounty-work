name: Cash Freelancer Excel Preflight

on:
  push:
    branches:
      - cash-freelancer-20260914
    paths:
      - .github/workflows/cash-freelancer-excel.yml
      - ops/cash_freelancer_excel_proposal.txt
      - ops/cash_freelancer_request.json

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      FLN_OAUTH_TOKEN: ${{ secrets.FLN_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cash-freelancer-20260914

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official Freelancer SDK
        run: python -m pip install -r ops/freelancer_requirements.txt

      - name: Run authenticated zero-write preflight
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          status_path = Path('ops/cash_freelancer_status.json')
          token = os.environ.get('FLN_OAUTH_TOKEN', '').strip()
          if not token:
              status = {
                  'stage': 'BLOCKED',
                  'project_id': 40708005,
                  'reason': 'FLN_OAUTH_TOKEN secret is not configured',
                  'bid_submitted': False,
              }
          else:
              cmd = [
                  'python', 'ops/freelancer_bid_bridge.py',
                  '--project-id', '40708005',
                  '--amount', '900',
                  '--period', '2',
                  '--milestone-percentage', '100',
                  '--description-file', 'ops/cash_freelancer_excel_proposal.txt',
              ]
              proc = subprocess.run(cmd, text=True, capture_output=True)
              status = {
                  'stage': 'PREFLIGHT_OK' if proc.returncode == 0 else 'PREFLIGHT_FAILED',
                  'project_id': 40708005,
                  'returncode': proc.returncode,
                  'stdout': proc.stdout[-6000:],
                  'stderr': proc.stderr[-3000:],
                  'bid_submitted': False,
              }
          status_path.write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
          print(status_path.read_text())
          PY

      - name: Persist non-sensitive status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/cash_freelancer_status.json
          git diff --cached --quiet || git commit -m 'cash: persist Freelancer preflight status'
          git push origin HEAD:cash-freelancer-20260914
