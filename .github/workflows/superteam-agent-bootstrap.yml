name: Superteam Agent Bootstrap

on:
  push:
    paths:
      - '.github/workflows/superteam-agent-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register agent and fetch agent-eligible bounties
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p superteam-agent

          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://superteam.fun/api/agents"
          payload = json.dumps({"name": "BAP2686Agent"}).encode()
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "BAP2686Agent/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  body = response.read()
          except urllib.error.HTTPError as exc:
              status = exc.code
              body = exc.read()
          with open("/tmp/superteam-registration-status", "w") as f:
              f.write(str(status))
          with open("/tmp/superteam-registration.json", "wb") as f:
              f.write(body)
          PY

          HTTP_CODE=$(cat /tmp/superteam-registration-status)
          REG_FILE=/tmp/superteam-registration.json
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "Superteam registration failed with HTTP $HTTP_CODE"
            if jq -e . "$REG_FILE" >/dev/null 2>&1; then
              jq 'del(.apiKey,.claimCode,.token,.secret)' "$REG_FILE"
            else
              sed -E 's/(apiKey|claimCode|token|secret)[^[:space:]]*/[REDACTED]/Ig' "$REG_FILE"
            fi
            exit 1
          fi

          REGISTRATION=$(cat "$REG_FILE")
          API_KEY=$(printf '%s' "$REGISTRATION" | jq -r '.apiKey // empty')
          CLAIM_CODE=$(printf '%s' "$REGISTRATION" | jq -r '.claimCode // empty')
          AGENT_ID=$(printf '%s' "$REGISTRATION" | jq -r '.agentId // empty')
          USERNAME=$(printf '%s' "$REGISTRATION" | jq -r '.username // empty')

          test -n "$API_KEY"
          test -n "$CLAIM_CODE"
          echo "::add-mask::$API_KEY"
          echo "::add-mask::$CLAIM_CODE"

          curl -q --fail-with-body -sS \
            "https://superteam.fun/api/agents/listings/live?take=100&type=bounty&deadline=2026-12-31" \
            -H "Authorization: Bearer $API_KEY" \
            -o superteam-agent/live-listings.json

          jq -n \
            --arg agentId "$AGENT_ID" \
            --arg username "$USERNAME" \
            --arg generatedAt "$(date -u +%FT%TZ)" \
            '{agentId:$agentId,username:$username,generatedAt:$generatedAt}' \
            > superteam-agent/agent-public-meta.json

          cat > /tmp/superteam-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsRlPjaTP+mNL8eZaCjfh
          fBAqO0XsbqfntVu22q30NMAfjbZMdlPgcvOy3kyOJnAVUhhYioEc/C42nM1TK01k
          Sgu8nzN+/jRAKDlHm6zb4JZsO3zEuT668p1uVG/b3s1mSl5RJ9ZbWPimz60cgicA
          1LEzjovgTOrXJQ/XLtJz5WMtuoc/TpjL7g2xaI3fAyiiahXPWnO9GZkEoGLd1rFM
          T8J6u9VFt7eLytD2C2wdgj5SDl/sJviybuYwNnReJt1dsFgJa8QpibpaPpl4JMYB
          qhi03LW1jSXW9X3AttQE0Ck4uIDor6iabCN0AWT69Htt+kuMyYOQkvqbRCcfdYPe
          xwIDAQAB
          -----END PUBLIC KEY-----
          PEM

          printf '%s' "$API_KEY" | openssl pkeyutl -encrypt -pubin -inkey /tmp/superteam-public.pem | base64 -w0 > superteam-agent/api-key.enc
          printf '%s' "$CLAIM_CODE" | openssl pkeyutl -encrypt -pubin -inkey /tmp/superteam-public.pem | base64 -w0 > superteam-agent/claim-code.enc

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add superteam-agent/live-listings.json superteam-agent/agent-public-meta.json superteam-agent/api-key.enc superteam-agent/claim-code.enc
          git commit -m "Bootstrap Superteam agent bounty feed"
          git push
