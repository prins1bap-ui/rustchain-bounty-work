name: t2000 Market Watch

on:
  push:
    paths:
      - '.github/workflows/t2000-market-watch.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan t2000 public market
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib.request
          from html import unescape
          from urllib.parse import urljoin

          BASE = 'https://t2000.ai'
          URLS = {
              'jobs': BASE + '/jobs',
              'agent': BASE + '/514',
              'service': BASE + '/514/services/website-contact-tech-snapshot',
          }
          HEADERS = {'User-Agent': 'Mozilla/5.0 t2000-market-watch/3.0'}
          KEYWORDS = (
              'research', 'website', 'company', 'contact', 'technology', 'tech stack',
              'technical qa', 'qa', 'analysis', 'audit', 'data', 'structured', 'web',
              'verification', 'verify', 'prospect', 'business', 'competitive',
          )

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8', 'replace')

          def textify(s):
              s = re.sub(r'<script\b[^>]*>.*?</script>', ' ', s, flags=re.S|re.I)
              s = re.sub(r'<style\b[^>]*>.*?</style>', ' ', s, flags=re.S|re.I)
              s = re.sub(r'<[^>]+>', ' ', s)
              return unescape(re.sub(r'\s+', ' ', s)).strip()

          pages = {k: fetch(v) for k, v in URLS.items()}
          jobs_html = pages['jobs']
          agent_text = textify(pages['agent'])
          service_text = textify(pages['service'])

          service_live = (
              'Website Contact + Tech Snapshot' in service_text and
              ('$50.00' in service_text or '$50' in service_text)
          )

          throughput = None
          m = re.search(r'Throughput:\s*(\d+)\s*/\s*(\d+)', agent_text, re.I)
          if m:
              throughput = {'in_flight': int(m.group(1)), 'capacity': int(m.group(2))}

          # Discover public job detail URLs. Handles relative, absolute, and escaped hrefs.
          normalized = jobs_html.replace('\\u002F', '/').replace('\\/', '/')
          candidates = set()
          patterns = (
              r'href=["\']([^"\']*?/jobs/0x[a-fA-F0-9]+)["\']',
              r'(https://t2000\.ai/jobs/0x[a-fA-F0-9]+)',
              r'(/jobs/0x[a-fA-F0-9]+)',
          )
          for pattern in patterns:
              for href in re.findall(pattern, normalized):
                  candidates.add(urljoin(BASE, href))

          job_paths = sorted(candidates)

          qualified = []
          inspected = 0
          for url in job_paths[:200]:
              try:
                  raw = fetch(url)
              except Exception:
                  continue
              inspected += 1
              text = textify(raw)
              low = text.lower()
              if 'open' not in low or 'claim' not in low:
                  continue
              amounts = [float(x) for x in re.findall(r'\$\s*([0-9]+(?:\.[0-9]{1,2})?)', text)]
              if not amounts:
                  continue
              price = max(amounts)
              if price < 40.0:
                  continue
              hits = sorted({kw for kw in KEYWORDS if kw in low})
              if not hits:
                  continue
              title = ''
              tm = re.search(r'<title>(.*?)</title>', raw, re.S|re.I)
              if tm:
                  title = unescape(re.sub(r'\s+', ' ', tm.group(1))).strip()
              qualified.append({
                  'price': price,
                  'title': title or 't2000 open job',
                  'url': url,
                  'keyword_hits': hits[:8],
              })

          result = {
              'service_live': service_live,
              'throughput': throughput,
              'job_links_discovered': len(job_paths),
              'job_pages_inspected': inspected,
              'qualified_open_jobs_40_plus': qualified,
              'agent_url': URLS['agent'],
              'service_url': URLS['service'],
          }
          print(json.dumps(result, indent=2))

          alerts = []
          if not service_live:
              alerts.append('The public $50 Website Contact + Tech Snapshot listing no longer appears live.')
          if throughput and throughput['in_flight'] > 0:
              alerts.append(f"Atlas Research #514 now shows {throughput['in_flight']} in-flight job(s).")
          if len(job_paths) == 0:
              alerts.append('WATCHER HEALTH FAILURE: zero t2000 job links discovered. Treat market scan as invalid until repaired.')
          for job in qualified:
              alerts.append(
                  f"Qualified t2000 Open job: ${job['price']:.2f} | {job['title']} | {job['url']} | "
                  f"matches: {', '.join(job['keyword_hits'])}"
              )

          with open('/tmp/alert.txt', 'w') as f:
              f.write('\n'.join(alerts))
          PY

          if [ -s /tmp/alert.txt ]; then
            echo 'alert=true' >> "$GITHUB_OUTPUT"
            {
              echo 'body<<EOF'
              cat /tmp/alert.txt
              echo
              echo 'Public jobs: https://t2000.ai/jobs'
              echo 'Atlas Research #514: https://t2000.ai/514'
              echo 'Service: https://t2000.ai/514/services/website-contact-tech-snapshot'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'alert=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Open alert issue
        if: steps.scan.outputs.alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 't2000 revenue signal detected';
            const body = `${{ steps.scan.outputs.body }}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
