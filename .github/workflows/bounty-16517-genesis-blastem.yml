name: Bounty 16517 Genesis BlastEm

on:
  push:
    branches: [bounty-16517-genesis-blastem-20260910]
    paths:
      - '.github/workflows/bounty-16517-genesis-blastem.yml'
      - '16517-genesis-blastem/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install BlastEm build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git make gcc g++ python3 libsdl2-dev libglew-dev zlib1g-dev libpng-dev libgtk-3-dev libzstd-dev

      - name: Prepare exact historical Genesis benchmark
        run: |
          set -euxo pipefail
          git clone https://github.com/Scottcjn/legend-of-elya-genesis.git genesis-main
          cp -a genesis-main genesis-hist
          cd genesis-hist
          git checkout 6b5ce98e44bb07e9156291ffd470ff7371e170e9
          rm -rf bench
          cp -a ../genesis-main/bench ./bench
          rm -f bench/src/elya_gpt.c bench/src/elya_gpt.h bench/src/elya_router.h
          cp src/elya_gpt.c src/elya_gpt.h src/elya_router.h bench/src/
          cp res/elya_brain_w16.bin bench/res/model.bin
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bench/src/bench_main.c')
          s=p.read_text()
          old='    bench_status = 0x5A;\n    bench_marker = 4;                       /* results readable */\n'
          new='    bench_status = 0x5A;\n    for (u16 i = 0; i < BENCH_NTOK; i++) {\n        bench_marker = 0x8000u | ((u32)i << 8) | bench_tok[i];\n    }\n    bench_marker = 4;                       /* results readable */\n'
          if old not in s: raise SystemExit('bench insertion point missing')
          p.write_text(s.replace(old,new,1))
          PY
          printf '%s\n%s\n' 'SOURCE_COMMIT=6b5ce98e44bb07e9156291ffd470ff7371e170e9' "$(git rev-parse HEAD)" > ../source.txt

      - name: Build historical benchmark ROM with official SGDK container
        run: |
          set -euxo pipefail
          docker pull ghcr.io/stephane-d/sgdk:latest
          chmod -R a+rwX genesis-hist/bench
          docker run --rm -v "$PWD/genesis-hist/bench:/src" ghcr.io/stephane-d/sgdk:latest
          test -s genesis-hist/bench/out/rom.bin
          test -s genesis-hist/bench/out/symbol.txt
          sha256sum genesis-hist/bench/out/rom.bin | tee rom-sha256.txt
          grep -E 'bench_(marker|expert|status|ntok|tok)' genesis-hist/bench/out/symbol.txt | tee symbols.txt

      - name: Resolve marker address
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('genesis-hist/bench/out/symbol.txt').read_text(errors='replace')
          line=next((x for x in text.splitlines() if 'bench_marker' in x), None)
          if not line: raise SystemExit('bench_marker absent from symbols')
          vals=re.findall(r'(?i)(?:0x)?([0-9a-f]{6,8})', line)
          if not vals: raise SystemExit(f'cannot parse marker: {line}')
          addr=int(vals[0],16)&0xFFFFFF
          Path('watch.env').write_text(f'MARKER_ADDR=0x{addr:06X}\nWATCH_ADDR=0x{addr:06X}\n')
          print(Path('watch.env').read_text(),end='')
          PY

      - name: Build independent BlastEm instrument
        run: |
          set -euxo pipefail
          source watch.env
          git clone --depth 1 https://github.com/libretro/blastem.git blastem
          cd blastem
          git rev-parse HEAD | tee ../blastem-commit.txt
          cd ..
          python3 16517-genesis-blastem/instrument_blastem.py blastem/m68k_util.c "$WATCH_ADDR"
          cd blastem
          make -j2
          (./blastem -v || true) 2>&1 | tee ../blastem-version.txt

      - name: Run three independent BlastEm measurements
        run: |
          set -euxo pipefail
          mkdir -p evidence
          for n in 1 2 3; do
            rc=0
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 90s ./blastem/blastem -b 5000 genesis-hist/bench/out/rom.bin >"evidence/run${n}.stdout" 2>"evidence/run${n}.stderr" || rc=$?
            echo "exit=$rc" > "evidence/run${n}.exit"
            grep RTCWATCH "evidence/run${n}.stderr" > "evidence/run${n}.watch" || true
          done

      - name: Parse counts and enforce deterministic token gate
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          expected=[67,97,108,108,32,109,101,32,83,111,112,104,105,97,32,69,108,121,97,44,32,121,111,117]
          published=142_972_761
          results=[]
          for n in range(1,4):
              rows=[]
              for line in Path(f'evidence/run{n}.watch').read_text(errors='replace').splitlines():
                  m=re.search(r'value=0x([0-9A-Fa-f]{4})\s+master_cycles=(\d+)',line)
                  if m: rows.append((int(m.group(1),16),int(m.group(2))))
              starts=[c for v,c in rows if v==1]
              ends=[c for v,c in rows if v==2]
              if not starts or not ends: raise SystemExit(f'run {n}: missing timing markers, rows={len(rows)}')
              pairs={(v>>8)&0x1F:v&0xFF for v,c in rows if 0x8000<=v<=0x97FF}
              tokens=[pairs[i] for i in range(24)] if all(i in pairs for i in range(24)) else []
              if tokens!=expected: raise SystemExit(f'run {n}: token gate failed: {tokens}')
              master=ends[0]-starts[0]
              if master%7: raise SystemExit(f'run {n}: master delta {master} not divisible by 7')
              cyc=master//7
              results.append({'run':n,'master_delta':master,'m68k_cycles':cyc,'token_text':bytes(tokens).decode(),'tokens':tokens,'delta_from_published':cyc-published,'pct_delta':(cyc-published)*100/published})
          if len({r['m68k_cycles'] for r in results})!=1:
              raise SystemExit(f'non-deterministic cycles: {[r["m68k_cycles"] for r in results]}')
          out={'source_commit':'6b5ce98e44bb07e9156291ffd470ff7371e170e9','published_m68k_cycles':published,'clock_divider':7,'results':results,'deterministic':True,'token_gate':True}
          Path('evidence/result.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Write evidence summary
        if: always()
        run: |
          mkdir -p evidence
          {
            echo '# #16517 Genesis -> BlastEm independent reproduction'
            echo
            echo '- Source commit: 6b5ce98e44bb07e9156291ffd470ff7371e170e9'
            echo '- Published historical target: 142,972,761 68000 cycles / 38 forward passes'
            echo '- Independent emulator: BlastEm; exact commit recorded in blastem-commit.txt'
            echo '- Marker address derived from generated symbol.txt; no hard-coded RAM address'
            echo '- Timing source: BlastEm 68000 context master-cycle counter, divided by hardware clock divider 7'
            echo '- Correctness evidence emitted after END and outside measured interval'
            echo
            if test -f evidence/result.json; then cat evidence/result.json; else echo 'FAIL-CLOSED: no validated result.'; fi
          } > evidence/REPORT.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounty-16517-genesis-blastem-evidence
          path: |
            evidence/
            source.txt
            symbols.txt
            watch.env
            rom-sha256.txt
            blastem-version.txt
            blastem-commit.txt
            genesis-hist/bench/out/symbol.txt
          if-no-files-found: warn
