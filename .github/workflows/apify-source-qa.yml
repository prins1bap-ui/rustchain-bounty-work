name: Apify Actor Source QA

on:
  push:
    branches:
      - apify-bridge-20260902
    paths:
      - 'apify_actor/**'
      - '.github/workflows/apify-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APIFY_CLI_DISABLE_TELEMETRY: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reconstruct canonical scanner and report hash
        run: |
          cd apify_actor
          cat src/scanner_parts/part1.part src/scanner_parts/part2.part src/scanner_parts/part3.part src/scanner_parts/part4.part > src/scanner.py
          printf 'SCANNER_SHA256=' && sha256sum src/scanner.py | awk '{print $1}'

      - name: Install test dependencies
        run: |
          python -m pip install -r apify_actor/requirements.txt pytest==9.1.1

      - name: Run deterministic QA
        run: |
          cd apify_actor
          python -m pytest -q
          python -m compileall -q src
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.actor').glob('*.json'):
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
          print('Actor JSON parse OK')
          PY

      - name: Validate Actor schemas with official Apify CLI
        run: |
          npm install -g apify-cli@1.10.0
          cd apify_actor
          apify --version
          apify validate-schema

      - name: Verify zero-secret source tree
        run: |
          if grep -R -n -E '(^|[^A-Z_])APIFY_TOKEN[[:space:]]*=' apify_actor --exclude-dir=tests; then
            echo 'Unexpected token assignment found in Actor source.' >&2
            exit 1
          fi
          echo 'No APIFY_TOKEN assignment is present in staged Actor source.'

      - name: Build the exact Actor Docker image
        run: |
          docker build --pull --tag website-tech-contact-snapshot:qa apify_actor
