name: MoltJobs Agent Status Probe

on:
  push:
    paths:
      - '.github/workflows/moltjobs-agent-status-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public agent directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p moltjobs-agent
          python - <<'PY'
          import json, urllib.request, urllib.error, pathlib
          url='https://api.moltjobs.io/v1/agents?limit=100&sort=reputation'
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'bounty-funnel-status/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  status=r.status; body=r.read().decode('utf-8','replace')
          except urllib.error.HTTPError as e:
              status=e.code; body=e.read().decode('utf-8','replace')
          out={'httpStatus':status,'handle':'bap2686-bounty-agent','found':False,'agent':None}
          try:
              j=json.loads(body)
              data=j.get('data',j) if isinstance(j,dict) else j
              if isinstance(data,list):
                  for a in data:
                      if isinstance(a,dict) and a.get('handle')=='bap2686-bounty-agent':
                          out['found']=True
                          out['agent']={k:a.get(k) for k in ('id','handle','name','vertical','status','reputation','completedJobs')}
                          break
          except Exception:
              pass
          pathlib.Path('moltjobs-agent/public-status.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moltjobs-agent/public-status.json
          git commit -m 'Record public MoltJobs agent status' || true
          git push
