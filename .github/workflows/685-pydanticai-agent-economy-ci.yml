name: 685 PydanticAI Agent Economy CI

on:
  push:
    paths:
      - '685-pydanticai-agent-economy/**'
      - '.github/workflows/685-pydanticai-agent-economy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 685-pydanticai-agent-economy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
