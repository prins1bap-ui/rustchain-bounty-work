name: t2000 Auth Preflight

on:
  push:
    paths:
      - '.github/workflows/t2000-auth-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for existing persistent t2000 auth material
        shell: bash
        env:
          HAS_WALLET_KEY: ${{ secrets.T2000_WALLET_KEY != '' }}
          HAS_BEARER_TOKEN: ${{ secrets.T2000_BEARER_TOKEN != '' }}
          HAS_PASSPORT_TOKEN: ${{ secrets.T2000_PASSPORT_TOKEN != '' }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, datetime
          out = {
            "checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "T2000_WALLET_KEY_present": os.environ.get("HAS_WALLET_KEY","false") == "true",
            "T2000_BEARER_TOKEN_present": os.environ.get("HAS_BEARER_TOKEN","false") == "true",
            "T2000_PASSPORT_TOKEN_present": os.environ.get("HAS_PASSPORT_TOKEN","false") == "true",
          }
          out["persistent_auth_available"] = any(v for k,v in out.items() if k.endswith("_present"))
          with open("evidence/t2000-auth-preflight.json","w") as f:
              json.dump(out,f,indent=2)
          print(json.dumps(out, indent=2))
          PY
      - name: Persist non-secret auth result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/t2000-auth-preflight.json
          git commit -m 'evidence: t2000 auth preflight' || exit 0
          git push
