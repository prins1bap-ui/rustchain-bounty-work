name: RTC Wallet Reconcile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtc-wallet-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch authoritative public wallet state
        shell: bash
        run: |
          set -euo pipefail
          WALLET='RTCc5449fe1b93385961152720c864c0f073dae5855'
          mkdir -p reconciliation
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 30 \
            "https://rustchain.org/wallet/balance?miner_id=${WALLET}" \
            -o reconciliation/rtc-balance.json
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 30 \
            "https://rustchain.org/wallet/history?miner_id=${WALLET}&limit=200" \
            -o reconciliation/rtc-history.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('reconciliation/rtc-balance.json'), Path('reconciliation/rtc-history.json')]:
              data = json.loads(p.read_text())
              p.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Commit reconciliation snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reconciliation/rtc-balance.json reconciliation/rtc-history.json
          if git diff --cached --quiet; then
            echo 'No wallet-state changes to commit.'
            exit 0
          fi
          git commit -m 'chore: reconcile RTC wallet state'
          git push
