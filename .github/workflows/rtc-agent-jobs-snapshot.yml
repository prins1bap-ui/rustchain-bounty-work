name: RTC Agent Jobs Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    paths:
      - '.github/workflows/rtc-agent-jobs-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live Agent Economy jobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          source_url='https://rustchain.org/agent/jobs'
          curl -skfS --connect-timeout 10 --max-time 25 \
            --resolve 'rustchain.org:443:50.28.86.131' \
            -H 'User-Agent: rtc-operator/1.0' \
            "$source_url" -o /tmp/agent_jobs.json
          python - <<'PY'
          import json, datetime
          with open('/tmp/agent_jobs.json','r',encoding='utf-8') as f:
              data=json.load(f)
          out={
              'fetched_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source': 'https://rustchain.org/agent/jobs',
              'origin_ip': '50.28.86.131',
              'data': data,
          }
          with open('ops/agent_jobs_snapshot.json','w',encoding='utf-8') as f:
              json.dump(out,f,indent=2,sort_keys=True)
              f.write('\n')
          PY
      - name: Commit snapshot if changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- ops/agent_jobs_snapshot.json)" ]; then
            echo 'No agent-job snapshot change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/agent_jobs_snapshot.json
          git commit -m 'ops: refresh live RTC agent jobs snapshot'
          git push
