name: DeskCrew + Hober Live Inventory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deskcrew-hober-inventory.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read free public inventory only
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error, urllib.parse, datetime, os

          out={
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'money_spent':False,
            'wallet_created':False,
            'deskcrew':{},
            'hober':{}
          }

          def get(url, accept='application/json,text/html,*/*'):
            req=urllib.request.Request(url,headers={'User-Agent':'paid-work-inventory/1.0','Accept':accept})
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                raw=r.read(750000).decode('utf-8','replace')
                return {'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type'),'raw':raw}
            except urllib.error.HTTPError as e:
              try: raw=e.read(200000).decode('utf-8','replace')
              except Exception: raw=''
              return {'status':e.code,'final_url':getattr(e,'url',url),'error':str(e),'raw':raw}
            except Exception as e:
              return {'status':None,'error':type(e).__name__+': '+str(e),'raw':''}

          # DeskCrew: explicitly documented free endpoints.
          for name,url in {
            'contests':'https://deskcrew.io/api/arena/contests',
            'board':'https://deskcrew.io/api/arena/board',
            'x402':'https://deskcrew.io/.well-known/x402'
          }.items():
            r=get(url)
            entry={k:v for k,v in r.items() if k!='raw'}
            try: entry['body']=json.loads(r['raw'])
            except Exception: entry['body_text']=r['raw'][:20000]
            out['deskcrew'][name]=entry

          # Hober public marketplace page; follow canonical redirect and inspect its public JS
          # only to discover the read-only job feed used by the site.
          page=get('https://app.hober.dev/marketplace/jobs','text/html,*/*')
          out['hober']['page']={k:v for k,v in page.items() if k!='raw'}
          html=page.get('raw','')
          script_srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          base=page.get('final_url') or 'https://app.hober.dev/marketplace/jobs'
          found=set()
          for src in script_srcs[:30]:
            u=urllib.parse.urljoin(base,src)
            js=get(u,'*/*')
            text=js.get('raw','')
            for m in re.findall(r'https?://[^"\'`\\\s]+',text):
              if 'hober' in m.lower() and ('api' in m.lower() or 'job' in m.lower()): found.add(m[:500])
            for m in re.findall(r'["\'`](\/api\/[^"\'`\\\s?]+)',text):
              if 'job' in m.lower() or 'market' in m.lower(): found.add(urllib.parse.urljoin('https://app.hober.dev',m)[:500])
          out['hober']['discovered_candidate_urls']=sorted(found)[:100]

          # Probe only same-service public-looking GET candidates, never mutation endpoints.
          probed=[]
          for u in out['hober']['discovered_candidate_urls']:
            lu=u.lower()
            if not u.startswith('http'): continue
            if any(x in lu for x in ['/create','/post','/fund','/settle','/bid','/deliver','/delete','/update']): continue
            if 'job' not in lu: continue
            r=get(u)
            e={'url':u,**{k:v for k,v in r.items() if k!='raw'}}
            try: e['body']=json.loads(r['raw'])
            except Exception: e['body_text']=r['raw'][:10000]
            probed.append(e)
            if len(probed)>=20: break
          out['hober']['probes']=probed

          os.makedirs('evidence',exist_ok=True)
          with open('evidence/deskcrew-hober-inventory.json','w') as f: json.dump(out,f,indent=2)
          PY
      - name: Persist evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/deskcrew-hober-inventory.json
          git diff --cached --quiet || git commit -m 'Refresh DeskCrew and Hober live inventory evidence'
          git push
