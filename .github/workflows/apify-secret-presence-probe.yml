name: Apify Secret Presence Probe

on:
  push:
    branches:
      - apify-bridge-20260902
    paths:
      - '.github/workflows/apify-secret-presence-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      C1: ${{ secrets.APIFY_TOKEN }}
      C2: ${{ secrets.APIFY_API_TOKEN }}
      C3: ${{ secrets.APIFY_API_KEY }}
      C4: ${{ secrets.APIFY_KEY }}
      C5: ${{ secrets.APIFY_PERSONAL_API_TOKEN }}
      C6: ${{ secrets.APIFY_PERSONAL_TOKEN }}
      C7: ${{ secrets.APIFY_ACCESS_TOKEN }}
      C8: ${{ secrets.APIFY_CLI_TOKEN }}
      C9: ${{ secrets.ACTOR_APIFY_TOKEN }}
      C10: ${{ secrets.APIFY_ACTOR_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          names=(APIFY_TOKEN APIFY_API_TOKEN APIFY_API_KEY APIFY_KEY APIFY_PERSONAL_API_TOKEN APIFY_PERSONAL_TOKEN APIFY_ACCESS_TOKEN APIFY_CLI_TOKEN ACTOR_APIFY_TOKEN APIFY_ACTOR_TOKEN)
          vals=("$C1" "$C2" "$C3" "$C4" "$C5" "$C6" "$C7" "$C8" "$C9" "$C10")
          found=0
          for i in "${!names[@]}"; do
            if [ -n "${vals[$i]}" ]; then
              echo "${names[$i]}=PRESENT"
              found=$((found+1))
            else
              echo "${names[$i]}=ABSENT"
            fi
          done
          echo "candidate_secret_count_present=$found"
          # Deliberately never print secret values, lengths, hashes, prefixes, or derived material.
