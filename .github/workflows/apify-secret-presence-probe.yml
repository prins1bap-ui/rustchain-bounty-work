name: Apify Secret Presence Probe

on:
  push:
    branches:
      - apify-bridge-20260902
    paths:
      - '.github/workflows/apify-secret-presence-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S1: ${{ secrets.APIFY_TOKEN }}
      S2: ${{ secrets.APIFY_API_TOKEN }}
      S3: ${{ secrets.APIFY_API_KEY }}
      S4: ${{ secrets.APIFY_KEY }}
      S5: ${{ secrets.APIFY_PERSONAL_API_TOKEN }}
      S6: ${{ secrets.APIFY_PERSONAL_TOKEN }}
      S7: ${{ secrets.APIFY_ACCESS_TOKEN }}
      S8: ${{ secrets.APIFY_CLI_TOKEN }}
      S9: ${{ secrets.ACTOR_APIFY_TOKEN }}
      S10: ${{ secrets.APIFY_ACTOR_TOKEN }}
      V1: ${{ vars.APIFY_TOKEN }}
      V2: ${{ vars.APIFY_API_TOKEN }}
      V3: ${{ vars.APIFY_API_KEY }}
      V4: ${{ vars.APIFY_KEY }}
      V5: ${{ vars.APIFY_PERSONAL_API_TOKEN }}
      V6: ${{ vars.APIFY_PERSONAL_TOKEN }}
      V7: ${{ vars.APIFY_ACCESS_TOKEN }}
      V8: ${{ vars.APIFY_CLI_TOKEN }}
      V9: ${{ vars.ACTOR_APIFY_TOKEN }}
      V10: ${{ vars.APIFY_ACTOR_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          names=(APIFY_TOKEN APIFY_API_TOKEN APIFY_API_KEY APIFY_KEY APIFY_PERSONAL_API_TOKEN APIFY_PERSONAL_TOKEN APIFY_ACCESS_TOKEN APIFY_CLI_TOKEN ACTOR_APIFY_TOKEN APIFY_ACTOR_TOKEN)
          svals=("$S1" "$S2" "$S3" "$S4" "$S5" "$S6" "$S7" "$S8" "$S9" "$S10")
          vvals=("$V1" "$V2" "$V3" "$V4" "$V5" "$V6" "$V7" "$V8" "$V9" "$V10")
          sfound=0
          vfound=0
          for i in "${!names[@]}"; do
            if [ -n "${svals[$i]}" ]; then
              echo "secret.${names[$i]}=PRESENT"
              sfound=$((sfound+1))
            else
              echo "secret.${names[$i]}=ABSENT"
            fi
            if [ -n "${vvals[$i]}" ]; then
              echo "variable.${names[$i]}=PRESENT"
              vfound=$((vfound+1))
            else
              echo "variable.${names[$i]}=ABSENT"
            fi
          done
          echo "candidate_secret_count_present=$sfound"
          echo "candidate_variable_count_present=$vfound"
          # Never print values, lengths, hashes, prefixes, or other derived secret material.
